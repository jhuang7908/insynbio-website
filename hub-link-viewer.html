<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>官方页面 · 美东华人生活圈</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      color: #0f172a;
    }
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #e2e8f0;
      backdrop-filter: blur(8px);
    }
    .btn-back {
      border: none; background: transparent; color: #c2410c;
      font-size: 15px; font-weight: 700; padding: 6px 0; cursor: pointer;
    }
    .page {
      max-width: 420px; margin: 0 auto;
      padding: 28px 20px max(32px, env(safe-area-inset-bottom));
    }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0;
      padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px; font-size: 20px; line-height: 1.35; font-weight: 800;
    }
    .meta {
      font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 12px;
    }
    .summary {
      font-size: 14px; color: #475569; line-height: 1.6; margin: 0 0 28px;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .actions a, .actions button {
      display: block; width: 100%; text-align: center; border: none; border-radius: 12px;
      padding: 16px 14px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .primary { background: #ea580c; color: #fff; }
    .secondary { background: #fff; color: #334155; border: 1px solid #e2e8f0; }
    .source {
      margin-top: 20px; font-size: 11px; color: #94a3b8; word-break: break-all; line-height: 1.4;
    }
  </style>
</head>
<body>
  <header class="bar">
    <button type="button" class="btn-back" id="btn-back">← 返回生活圈</button>
  </header>

  <main class="page">
    <span class="badge">已核验官方来源</span>
    <h1 id="card-title">官方页面</h1>
    <div class="meta" id="card-meta"></div>
    <p class="summary" id="card-summary" hidden></p>
    <div class="actions">
      <a class="primary" id="btn-primary" href="#">打开页面</a>
      <a class="secondary" id="btn-secondary" href="#">备用打开方式</a>
    </div>
    <div class="source" id="card-source"></div>
  </main>

  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const rawUrl = qs.get('url') || '';
      const returnPage = qs.get('return') || 'us-chinese-life-hub.html';
      const title = qs.get('title') || '官方页面';
      const module = qs.get('module') || '';
      const summary = qs.get('summary') || '';
      const meta = qs.get('meta') || '';
      const pref = qs.get('pref') || 'trans_zh';

      if (!rawUrl || !/^https?:\/\//i.test(rawUrl)) {
        document.body.innerHTML = '<p style="padding:20px">链接无效。<a href="' + returnPage + '">返回生活圈</a></p>';
        return;
      }

      function translateUrl(url, p) {
        if (p === 'raw_en') return url;
        const tl = (p === 'trans_zht') ? 'zh-TW' : 'zh-CN';
        return 'https://translate.google.com/translate?sl=auto&tl=' + tl + '&u=' + encodeURIComponent(url);
      }

      const primaryUrl = translateUrl(rawUrl, pref);
      const altPref = (pref === 'raw_en') ? 'trans_zh' : 'raw_en';
      const secondaryUrl = translateUrl(rawUrl, altPref);

      document.getElementById('card-title').textContent = title;
      document.title = title + ' · 生活圈';

      const metaEl = document.getElementById('card-meta');
      const metaParts = [module, meta].filter(Boolean);
      metaEl.textContent = metaParts.join(' · ');
      metaEl.hidden = metaParts.length === 0;

      const summaryEl = document.getElementById('card-summary');
      if (summary) {
        summaryEl.textContent = summary;
        summaryEl.hidden = false;
      }

      try {
        const host = new URL(rawUrl).hostname.replace(/^www\./, '');
        document.getElementById('card-source').textContent = host;
      } catch (_) {}

      function goBack() {
        if (history.length > 1) history.back();
        else location.href = returnPage;
      }
      document.getElementById('btn-back').onclick = goBack;

      const btnPrimary = document.getElementById('btn-primary');
      const btnSecondary = document.getElementById('btn-secondary');

      if (pref === 'raw_en') {
        btnPrimary.textContent = '打开英文原文';
        btnSecondary.textContent = '简体中文翻译';
      } else if (pref === 'trans_zht') {
        btnPrimary.textContent = '繁體中文翻译打开';
        btnSecondary.textContent = '英文原文';
      } else {
        btnPrimary.textContent = '简体中文翻译打开';
        btnSecondary.textContent = '英文原文';
      }

      btnPrimary.href = primaryUrl;
      btnSecondary.href = secondaryUrl;

      btnPrimary.addEventListener('click', function (e) {
        e.preventDefault();
        location.assign(primaryUrl);
      });
      btnSecondary.addEventListener('click', function (e) {
        e.preventDefault();
        location.assign(secondaryUrl);
      });
    })();
  </script>
</body>
</html>
