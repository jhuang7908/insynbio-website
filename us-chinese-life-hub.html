  <style>

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    
    /* Header */
    .top { background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }

    .sub { font-size: 11px; color: #64748b; font-weight: 600; }

    /* Preference Selector */
    .pref-selector { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #475569; }
    .pref-select { border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 700; background: #f8fafc; color: #1e293b; outline: none; cursor: pointer; }

    .searchbar input:focus { border-color: #ea580c; }

    /* Section Title */
    .section-title { font-size: 18px; font-weight: 900; color: #0f172a; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
    .muted { color: #64748b; font-size: 13px; margin: -8px 0 16px; }

    /* Module Grid (First Part) */
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }

    .pill:hover { background: #f1f5f9; }
    .pill.active { background: #ea580c; color: #ffffff; border-color: #ea580c; }

    .feed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .feed-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; min-height: 160px; transition: all 0.15s; }

    .title { font-size: 14px; font-weight: 800; line-height: 1.4; margin-bottom: 6px; color: #0f172a; }
    .summary { font-size: 12px; color: #475569; line-height: 1.6; flex: 1; }
    .foot { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: 8px; }

</head>

    <div style="height: 40px"></div>
  </main>

let activeModuleFilter = 'all';
let activeNeighborhoodFilter = 'all';

// Load language preference from localStorage
function initPreference() {
  const saved = localStorage.getItem('pref_lang_mode') || 'trans_zh';
  document.getElementById('pref-lang').value = saved;
}

function savePreference(val) {
  localStorage.setItem('pref_lang_mode', val);
}

function badgeColor(modName) {
  const m = MODULES.find(x => x.name === modName);
  return m ? m.color : '#475569';
}

// Render 9 Core Channels
function renderModules() {
  const box = document.getElementById('module-grid');
  box.innerHTML = MODULES.map(m => `
    <div class="module-card ${activeModuleFilter === m.name ? 'active' : ''}" onclick="selectModule('${m.name}')">
      <div class="module-name" style="color:${m.color}">
        <span>${m.name}</span>
        <span style="font-size:11px;color:#94a3b8;font-weight:normal;">${m.en}</span>
      </div>
      <div class="module-desc">${m.desc}</div>
    </div>
  `).join('');
}

function selectModule(name) {
  if (activeModuleFilter === name) {
    activeModuleFilter = 'all'; // toggle off
  } else {
    activeModuleFilter = name;
  }
  renderModules();
  renderFeed();
  
  // Smooth scroll to feed section
  document.getElementById('feed-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function setNeighborhoodFilter(boro, btn) {
  activeNeighborhoodFilter = boro;
  document.querySelectorAll('#neighborhood-filters .pill').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderFeed();
}

// Render high-density cards
function renderFeed() {
  const q = document.getElementById('q').value.toLowerCase();
  const city = document.getElementById('city').value;
  
  const filtered = ITEMS.filter(i => {
    const matchesModule = (activeModuleFilter === 'all' || i.module === activeModuleFilter);
    const matchesNeighborhood = (activeNeighborhoodFilter === 'all' || i.area === activeNeighborhoodFilter);
    const matchesCity = (city === 'all' || i.city === city);
    const matchesSearch = `${i.title} ${i.summary} ${i.area} ${i.module}`.toLowerCase().includes(q);
    return matchesModule && matchesNeighborhood && matchesCity && matchesSearch;
  });

  const feed = document.getElementById('feed');
  feed.innerHTML = filtered.map(i => `
    <article class="feed-card">
      <div class="meta">
        <span class="tag" style="background:${badgeColor(i.module)}15;color:${badgeColor(i.module)}">${i.module}</span>
        <span class="date">${i.date}</span>
      </div>
      <div class="title">${i.title}</div>
      <div class="summary">${i.summary}</div>
      <div class="foot">
        <span>📍 ${i.area} · 已核验</span>
        <button class="btn" onclick="openLinkDirect('${i.url.replace(/'/g, "\'")}')">查看链接 ➔</button>
      </div>
    </article>
  `).join('');

  if (!filtered.length) {
    feed.innerHTML = `
      <div style="grid-column: 1/-1; padding: 24px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; color: #64748b; font-size: 13px;">
        没有符合条件的信息，请换个关键词或选择其他频道。
      </div>
    `;
  }
}

// Open link directly in new tab based on saved preference
function openLinkDirect(url) {
  const pref = localStorage.getItem('pref_lang_mode') || 'trans_zh';
  let targetUrl = url;
  
  if (pref === 'trans_zh') {
    targetUrl = 'https://translate.google.com/translate?sl=en&tl=zh-CN&u=' + encodeURIComponent(url);
  } else if (pref === 'trans_zht') {
    targetUrl = 'https://translate.google.com/translate?sl=en&tl=zh-TW&u=' + encodeURIComponent(url);
  }
  
  window.open(targetUrl, '_blank');
}

// Initial Boot
initPreference();
renderModules();
renderFeed();
</script>
