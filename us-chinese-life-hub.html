<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美东华人生活圈 · 纽约公共信息发布</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif; background:#f4f6f8; color:#111827; }
    .wrap { max-width:1280px; margin:0 auto; padding:0 14px; }
    .top { background:#fff; border-bottom:1px solid #e5e7eb; position:sticky; top:0; z-index:20; }
    .top-inner { height:56px; display:flex; align-items:center; justify-content:space-between; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:900; }
    .logo-box { width:30px;height:30px;border-radius:8px;background:#f97316;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px; }
    .sub { font-size:11px; color:#9ca3af; font-weight:600; }

    .searchbar { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:10px; display:flex; gap:10px; margin-top:12px; }
    .searchbar input,.searchbar select { border:1px solid #e5e7eb; border-radius:8px; padding:8px 10px; font-size:13px; }
    .searchbar input{ flex:1; }

    .section-title { font-size:30px; font-weight:900; margin:20px 0 10px; }
    .muted { color:#6b7280; font-size:14px; }

    .module-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:12px; }
    .module-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
    .module-name { font-size:15px; font-weight:800; margin-bottom:8px; }
    .module-desc { font-size:14px; color:#4b5563; line-height:1.6; }

    .source-wrap { background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; margin-top:12px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px 14px; border-bottom:1px solid #f0f2f4; font-size:14px; text-align:left; }
    th { background:#f8fafc; font-weight:800; color:#374151; }

    .pillbar { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
    .pill { border:1px solid #d1d5db; background:#fff; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; }
    .pill.active { background:#111827; color:#fff; border-color:#111827; }

    .feed-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .feed-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; display:flex; flex-direction:column; min-height:170px; }
    .meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .tag { font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#4338ca; }
    .date { font-size:11px; color:#9ca3af; }
    .title { font-size:15px; font-weight:800; line-height:1.4; margin-bottom:8px; }
    .summary { font-size:13px; color:#4b5563; line-height:1.6; flex:1; }
    .foot { margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#9ca3af; }
    .btn { border:none; background:#111827; color:#fff; border-radius:6px; padding:6px 10px; font-size:11px; font-weight:800; cursor:pointer; }

    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.6); z-index:80; }
    .modal.open{ display:flex; }
    .modal-box{ width:min(460px,92vw); background:#fff; border-radius:14px; padding:18px; }
    .modal-title{ font-size:16px; font-weight:900; margin-bottom:8px; }

    @media (max-width: 1000px){ .feed-grid,.module-grid{ grid-template-columns:repeat(2,1fr);} }
    @media (max-width: 680px){ .feed-grid,.module-grid{ grid-template-columns:1fr;} .section-title{font-size:24px;} }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="logo">
        <div class="logo-box">圈</div>
        <div>
          <div>美东华人生活圈</div>
          <div class="sub">纽约地区 · 公共信息发布（高密度可读版）</div>
        </div>
      </div>
      <div>
        <select id="lang" onchange="changeLang(this.value)" style="border:1px solid #e5e7eb;border-radius:8px;padding:6px 8px;font-size:12px;">
          <option value="zh">简体</option><option value="zht">繁體</option><option value="en">EN</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="searchbar">
      <input id="q" placeholder="搜索福利、交通、教育、活动关键词..." oninput="renderFeed()" />
      <select id="city" onchange="renderFeed()"><option value="all">所有城市</option><option value="纽约" selected>纽约 NY</option></select>
    </div>

    <h2 class="section-title">9大核心频道划分</h2>
    <div class="module-grid" id="module-grid"></div>

    <h2 class="section-title">稳定可靠的信息来源地图</h2>
    <p class="muted">为避免来源资产被复制，前台仅展示来源代号与抓取通道，完整来源清单仅后台可见。</p>
    <div class="source-wrap">
      <table>
        <thead><tr><th>来源代号</th><th>覆盖频道</th><th>抓取通道</th><th>更新频率</th><th>可靠度</th></tr></thead>
        <tbody id="source-body"></tbody>
      </table>
    </div>

    <h2 class="section-title">纽约地区真实信息发布</h2>
    <p class="muted">按模块持续发布真实信息，每条都有简介与链接；点击可选择原文或自动翻译阅读。</p>
    <div class="pillbar" id="module-filters"></div>
    <div class="feed-grid" id="feed"></div>
    <div style="height:28px"></div>
  </main>

  <div id="link-modal" class="modal">
    <div class="modal-box">
      <div class="modal-title">请选择打开方式</div>
      <p class="muted" style="margin-top:0;margin-bottom:10px;">建议先看中文翻译版，再看官方原文。</p>
      <a id="link-trans" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px;" onclick="closeModal()">打开中文翻译网页</a>
      <a id="link-raw" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;background:#374151;margin-bottom:8px;" onclick="closeModal()">打开官方原文网页</a>
      <button class="btn" style="background:#e5e7eb;color:#374151;width:100%;" onclick="closeModal()">取消</button>
    </div>
  </div>

人英语 + 入籍辅导班", "summary": "包含入籍英文专项班，完全免费。", "url": "https://www.nypl.org/help/community-outreach/immigrant-services/learn-english"}, {"id": "e11", "module": "语言教育", "city": "纽约", "area": "Queens", "date": "2026-06-01", "title": "皇后区图书馆 2026 暑期少儿阅读挑战", "summary": "5-12岁，记录阅读进度可获得免费图书和纪念章。", "url": "https://www.queenslibrary.org/"}, {"id": "e12", "module": "社区安全", "city": "纽约", "area": "Queens", "date": "2026-06-17", "title": "法拉盛 109 警局警民月度会议（含中文翻译）", "summary": "通报近期治安、防诈骗提示，现场问答。", "url": "https://www.nyc.gov/site/nypd/bureaus/patrol/precincts/109th-precinct.page"}, {"id": "e13", "module": "社区安全", "city": "纽约", "area": "Brooklyn", "date": "2026-05-28", "title": "布鲁克林 72 警局防诈骗与防盗宣讲", "summary": "针对华人社区高发诈骗与入室盗窃场景。", "url": "https://www.nyc.gov/site/nypd/bureaus/patrol/precincts/72nd-precinct.page"}, {"id": "e14", "module": "社区安全", "city": "纽约", "area": "全市", "date": "2026-06-02", "title": "NYC 飓风季防灾指南（中文版）", "summary": "疏散地图与应急物资清单，官方中文版。", "url": "https://www.nyc.gov/site/em/ready/hurricane-guides.page"}, {"id": "e15", "module": "市政议员", "city": "纽约", "area": "Queens", "date": "2026-06-13", "title": "市议员办公室免费法律咨询（租务/移民）", "summary": "社区公益律师驻点，含中文支持。", "url": "https://council.nyc.gov/sandra-ung/"}, {"id": "e16", "module": "市政议员", "city": "纽约", "area": "全市", "date": "2026-06-11", "title": "NYC 选民登记与投票站查询", "summary": "输入地址快速查询投票站、时间与候选人。", "url": "https://vote.nyc/"}, {"id": "e17", "module": "公园亲子", "city": "纽约", "area": "全市", "date": "2026-06-27", "title": "NYC 公共室外泳池免费开放", "summary": "全市室外泳池开放，适合亲子夏季活动。", "url": "https://www.nycgovparks.org/facilities/outdoor-pools"}, {"id": "e18", "module": "公园亲子", "city": "纽约", "area": "全市", "date": "2026-06-01", "title": "NYC Parks 免费露天电影节", "summary": "多个公园放映亲子电影，无需预约。", "url": "https://www.nycgovparks.org/events/free-summer-movies"}, {"id": "e19", "module": "公园亲子", "city": "纽约", "area": "Queens", "date": "2026-06-09", "title": "皇后区植物园免费开放时段", "summary": "周三和周日特定时段免费入园。", "url": "https://queensbotanical.org/hours-admission/"}, {"id": "e20", "module": "文化展览", "city": "纽约", "area": "Queens", "date": "2026-06-20", "title": "法拉盛市政厅免费多元文化音乐会", "summary": "华人传统民乐演出，需提前线上登记。", "url": "https://www.flushingtownhall.org/"}, {"id": "e21", "module": "文化展览", "city": "纽约", "area": "Manhattan", "date": "2026-06-11", "title": "大都会博物馆纽约居民任意付费政策", "summary": "持NY地址证明可按意愿付费入馆。", "url": "https://www.metmuseum.org/visit/plan-your-visit"}, {"id": "e22", "module": "文化展览", "city": "纽约", "area": "Manhattan", "date": "2026-06-14", "title": "MoMA 每周五纽约居民免费时段", "summary": "指定时段免费，建议提前预约。", "url": "https://www.moma.org/calendar/programs/159"}, {"id": "e23", "module": "公益志愿", "city": "纽约", "area": "Queens", "date": "2026-06-07", "title": "慈济纽约分会食物发放志愿服务", "summary": "法拉盛每周固定公益发放并招募双语志愿者。", "url": "https://tzuchi.us/offices/new-york"}, {"id": "e24", "module": "公益志愿", "city": "纽约", "area": "全市", "date": "2026-06-11", "title": "Food Bank NYC 社区厨房志愿者招募", "summary": "华埠/布鲁克林点位，提供志愿证明。", "url": "https://www.foodbanknyc.org/volunteer/"}, {"id": "e25", "module": "消费促销", "city": "纽约", "area": "Queens", "date": "2026-06-08", "title": "法拉盛新世界超市本周折扣海报", "summary": "海鲜、蔬菜、杂货促销信息更新。", "url": "https://www.newworldmallny.com/"}];
let moduleFilter = 'all';

function badgeColor(mod){
  const m = MODULES.find(x=>x.name===mod); return m ? m.color : '#374151';
}

function renderModules(){
  const box = document.getElementById('module-grid');
  box.innerHTML = MODULES.map(m => `
    <div class="module-card">
      <div class="module-name" style="color:${m.color}">${m.name} (${m.en})</div>
      <div class="module-desc">${m.desc}</div>
    </div>
  `).join('');
}

function renderSourceMap(){
  document.getElementById('source-body').innerHTML = SOURCES.map(s => `
    <tr><td><strong>${s.code}</strong></td><td>${s.module}</td><td><code>${s.channel}</code></td><td>${s.freq}</td><td>${s.cred}</td></tr>
  `).join('');
}

function renderFilters(){
  const wrap = document.getElementById('module-filters');
  const names = ['all', ...MODULES.map(m=>m.name)];
  wrap.innerHTML = names.map(n=>`<button class="pill ${n===moduleFilter?'active':''}" onclick="setModuleFilter('${n}')">${n==='all'?'全部':n}</button>`).join('');
}

function setModuleFilter(n){ moduleFilter=n; renderFilters(); renderFeed(); }

function renderFeed(){
  const q = document.getElementById('q').value.toLowerCase();
  const city = document.getElementById('city').value;
  const data = ITEMS.filter(i => (moduleFilter==='all' || i.module===moduleFilter) && (city==='all'||i.city===city))
    .filter(i => (`${i.title} ${i.summary} ${i.area} ${i.module}`.toLowerCase().includes(q)));
  const feed = document.getElementById('feed');
  feed.innerHTML = data.map(i => `
    <article class="feed-card">
      <div class="meta">
        <span class="tag" style="background:${badgeColor(i.module)}22;color:${badgeColor(i.module)}">${i.module}</span>
        <span class="date">${i.date}</span>
      </div>
      <div class="title">${i.title}</div>
      <div class="summary">${i.summary}</div>
      <div class="foot">
        <span>${i.city} · ${i.area} · 已核验</span>
        <button class="btn" onclick="openLink('${i.url.replace(/'/g, "&#39;")}')">查看链接</button>
      </div>
    </article>
  `).join('');
  if(!data.length){
    feed.innerHTML = `<div class="muted" style="padding:18px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;">没有符合条件的信息，请换关键词或模块。</div>`;
  }
}

function openLink(url){
  document.getElementById('link-raw').href = url;
  document.getElementById('link-trans').href = 'https://translate.google.com/translate?sl=en&tl=zh-CN&u=' + encodeURIComponent(url);
  document.getElementById('link-modal').classList.add('open');
}
function closeModal(){ document.getElementById('link-modal').classList.remove('open'); }

function changeLang(lang){
  if(lang!=='zh') alert('页面主文案多语言版下一步接入，当前先保证信息密度与可读性。');
}

renderModules();
renderSourceMap();
renderFilters();
renderFeed();
</script>
</body>
</html>
