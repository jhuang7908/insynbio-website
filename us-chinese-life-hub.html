let currentLang = 'zh';
let activeModuleFilter = 'all';
let activeNeighborhoodFilter = 'all';

// Load language preference from localStorage
function initPreference() {
  const savedPref = localStorage.getItem('pref_lang_mode') || 'trans_zh';
  document.getElementById('pref-lang').value = savedPref;

  currentLang = localStorage.getItem('ui_lang_mode') || 'zh';
  document.getElementById('ui-lang').value = currentLang;
  
  applyUILanguage();
}

function savePreference(val) {
  localStorage.setItem('pref_lang_mode', val);
}

function changeUILanguage(lang) {
  currentLang = lang;
  localStorage.setItem('ui_lang_mode', lang);
  applyUILanguage();
}

function applyUILanguage() {
  const s = UI_STRINGS[currentLang];
  
  // Update static texts
  document.getElementById('page-title').textContent = s.title;
  document.getElementById('logo-text').textContent = s.logo_text;
  document.getElementById('logo-sub').textContent = s.logo_sub;
  document.getElementById('ui-lang-label').textContent = s.ui_lang_label;
  document.getElementById('pref-lang-label').textContent = s.pref_lang_label;
  
  // Update select options for link preferences
  const prefSelect = document.getElementById('pref-lang');
  prefSelect.options[0].text = s.trans_zh;
  prefSelect.options[1].text = s.trans_zht;
  prefSelect.options[2].text = s.raw_en;
  
  // Update search bar
  document.getElementById('q').placeholder = s.q_placeholder;
  document.getElementById('opt-all-cities').textContent = s.all_cities;
  document.getElementById('opt-ny-city').textContent = s.ny_city;
  
  // Update section titles
  document.getElementById('channels-title').textContent = s.channels_title;
  document.getElementById('channels-sub').textContent = s.channels_sub;
  document.getElementById('feed-title').innerHTML = `${s.feed_title} <button id="reset-filters" class="reset-btn" onclick="resetAllFilters()">${s.reset_btn}</button>`;
  document.getElementById('feed-sub').textContent = s.feed_sub;
  
  // Update neighborhood pills
  document.getElementById('pill-all').textContent = s.all_neighborhoods;
  document.getElementById('pill-citywide').textContent = s.citywide;
  document.getElementById('pill-flushing').textContent = s.flushing;
  document.getElementById('pill-chinatown').textContent = s.chinatown;
  document.getElementById('pill-sunset').textContent = s.sunset_park;
  
  renderModules();
  renderFeed();
}

function badgeColor(modName) {
  const m = MODULES.find(x => x.zh === modName || x.en === modName);
  return m ? m.color : '#475569';
}

// Render 9 Core Channels
function renderModules() {
  const box = document.getElementById('module-grid');
  box.innerHTML = MODULES.map(m => {
    const name = m[currentLang] || m.zh;
    const desc = m[`desc_${currentLang}`] || m.desc_zh;
    const isActive = activeModuleFilter === m.zh;
    return `
      <div class="module-card ${isActive ? 'active' : ''}" onclick="selectModule('${m.zh}')">
        <div class="module-name" style="color:${m.color}">
          <span>${name}</span>
          <span style="font-size:11px;color:#94a3b8;font-weight:normal;">${m.en}</span>
        </div>
        <div class="module-desc">${desc}</div>
      </div>
    `;
  }).join('');
}

function selectModule(name) {
  if (activeModuleFilter === name) {
    activeModuleFilter = 'all'; // toggle off
  } else {
    activeModuleFilter = name;
  }
  renderModules();
  renderFeed();
  updateResetButton();
  
  // Smooth scroll to feed section
  document.getElementById('feed-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function setNeighborhoodFilter(boro, btn) {
  activeNeighborhoodFilter = boro;
  document.querySelectorAll('#neighborhood-filters .pill').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderFeed();
  updateResetButton();
}

function resetAllFilters() {
  activeModuleFilter = 'all';
  activeNeighborhoodFilter = 'all';
  document.getElementById('q').value = '';
  document.querySelectorAll('#neighborhood-filters .pill').forEach(b => b.classList.remove('active'));
  document.querySelector('#neighborhood-filters .pill').classList.add('active');
  renderModules();
  renderFeed();
  updateResetButton();
}

function updateResetButton() {
  const btn = document.getElementById('reset-filters');
  const q = document.getElementById('q').value;
  if (activeModuleFilter !== 'all' || activeNeighborhoodFilter !== 'all' || q !== '') {
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
  }
}

// Render high-density cards
function renderFeed() {
  const q = document.getElementById('q').value.toLowerCase();
  const city = document.getElementById('city').value;
  const s = UI_STRINGS[currentLang];
  
  const filtered = ITEMS.filter(i => {
    const matchesModule = (activeModuleFilter === 'all' || i.module === activeModuleFilter);
    
    // Neighborhood matching
    let matchesNeighborhood = false;
    if (activeNeighborhoodFilter === 'all') {
      matchesNeighborhood = true;
    } else if (activeNeighborhoodFilter === '纽约全市' && (i.area_zh === '纽约全市' || i.area_en === 'NYC Citywide')) {
      matchesNeighborhood = true;
    } else if (activeNeighborhoodFilter === '法拉盛 Flushing' && (i.area_zh === '法拉盛 Flushing' || i.area_en === 'Flushing')) {
      matchesNeighborhood = true;
    } else if (activeNeighborhoodFilter === '唐人街 Chinatown' && (i.area_zh === '唐人街 Chinatown' || i.area_en === 'Chinatown')) {
      matchesNeighborhood = true;
    } else if (activeNeighborhoodFilter === '八大道 Sunset Park' && (i.area_zh === '八大道 Sunset Park' || i.area_en === 'Sunset Park')) {
      matchesNeighborhood = true;
    }
    
    const matchesCity = (city === 'all' || i.city === city);
    
    const title = i[`title_${currentLang}`] || i.title_zh;
    const summary = i[`summary_${currentLang}`] || i.summary_zh;
    const area = i[`area_${currentLang}`] || i.area_zh;
    const matchesSearch = `${title} ${summary} ${area}`.toLowerCase().includes(q);
    
    return matchesModule && matchesNeighborhood && matchesCity && matchesSearch;
  });

  const feed = document.getElementById('feed');
  feed.innerHTML = filtered.map(i => {
    const title = i[`title_${currentLang}`] || i.title_zh;
    const summary = i[`summary_${currentLang}`] || i.summary_zh;
    const area = i[`area_${currentLang}`] || i.area_zh;
    
    // Find matching module to display correct language tag
    const modObj = MODULES.find(m => m.zh === i.module);
    const modName = modObj ? (modObj[currentLang] || modObj.zh) : i.module;

    return `
      <article class="feed-card">
        <div class="meta">
          <span class="tag" style="background:${badgeColor(i.module)}15;color:${badgeColor(i.module)}">${modName}</span>
          <span class="date">${i.date}</span>
        </div>
        <div class="title">${title}</div>
        <div class="summary">${summary}</div>
        <div class="foot">
          <span>📍 ${area} · ${s.verified}</span>
          <button class="btn" onclick="openLinkDirect('${i.url.replace(/'/g, "\'")}')">${s.view_link}</button>
        </div>
      </article>
    `;
  }).join('');

  if (!filtered.length) {
    feed.innerHTML = `
      <div style="grid-column: 1/-1; padding: 24px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; color: #64748b; font-size: 13px;">
        ${s.no_results}
      </div>
    `;
  }
  updateResetButton();
}

// Open link directly in new tab based on saved preference
function openLinkDirect(url) {
  const pref = localStorage.getItem('pref_lang_mode') || 'trans_zh';
  let targetUrl = url;
  
  if (pref === 'trans_zh') {
    targetUrl = 'https://translate.google.com/translate?sl=en&tl=zh-CN&u=' + encodeURIComponent(url);
  } else if (pref === 'trans_zht') {
    targetUrl = 'https://translate.google.com/translate?sl=en&tl=zh-TW&u=' + encodeURIComponent(url);
  }
  
  window.open(targetUrl, '_blank');
}

// Initial Boot
