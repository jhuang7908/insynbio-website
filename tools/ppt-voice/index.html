<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPT 语音播放器</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2332; --border: #2d3a4f; --text: #e8edf4;
      --muted: #8b9cb3; --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b;
      --danger: #ef4444; --speaking: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
    .layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; max-width: 1280px; margin: 0 auto; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    h1 { font-size: 1.15rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.82rem; margin: 4px 0 12px; }
    .slide-stage { background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
    .slide-stage img { width: 100%; height: 100%; object-fit: contain; }
    .slide-title { margin-top: 10px; font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .status-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.idle { background: var(--muted); }
    .dot.listening { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.2s infinite; }
    .dot.speaking { background: var(--speaking); box-shadow: 0 0 8px var(--speaking); animation: pulse 0.8s infinite; }
    .dot.thinking { background: var(--warn); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .status-text { font-size: 0.85rem; }
    .status-text small { color: var(--muted); display: block; margin-top: 2px; font-size: 0.75rem; }
    .slide-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .slide-nav button, .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; }
    .slide-nav button:hover, .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { border-color: var(--danger); color: var(--danger); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .slide-num { flex: 1; text-align: center; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .panel h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .script { line-height: 1.6; font-size: 0.88rem; max-height: 160px; overflow-y: auto; }
    .faq-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .faq-chip { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px; font-size: 0.75rem; cursor: pointer; }
    .faq-chip:hover { border-color: var(--accent); }
    .transcript { min-height: 56px; font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .transcript .final { color: var(--text); }
    .transcript .interim { opacity: 0.6; font-style: italic; }
    .reply { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--accent); font-size: 0.85rem; }
    .settings summary { cursor: pointer; color: var(--muted); font-size: 0.82rem; }
    .settings label { display: block; font-size: 0.75rem; color: var(--muted); margin: 8px 0 4px; }
    .settings input { width: 100%; padding: 7px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.82rem; }
    .unsupported { color: var(--danger); font-size: 0.82rem; display: none; margin-bottom: 8px; padding: 8px 10px; background: rgba(239,68,68,0.12); border-radius: 8px; line-height: 1.45; }
    .hint { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
    .hint code { color: var(--accent); }
    .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="layout">
    <section>
      <h1 id="deckTitle">PPT 语音播放器</h1>
      <p class="sub" id="deckSub">幻灯片 + 语音讲解 + 可打断问答</p>
      <div class="slide-stage"><img id="slideImage" alt="当前幻灯片" /></div>
      <p class="slide-title" id="slideTitle">—</p>
      <p class="hint">← → 翻页 · 空格讲解 · 说「继续」恢复讲解 · Esc 停止</p>
    </section>
    <aside>
      <p class="unsupported" id="unsupported"></p>
      <div class="status-bar">
        <div class="dot idle" id="statusDot"></div>
        <div class="status-text">
          <span id="statusLabel">待命</span>
          <small id="statusHint">线上使用 OpenAI 语音（无需 MiniMax）；本地可浏览器备用</small>
        </div>
      </div>
      <div class="slide-nav">
        <button type="button" id="btnPrev">上一页</button>
        <div class="slide-num"><span id="slideIndex">1</span> / <span id="slideTotal">1</span></div>
        <button type="button" id="btnNext">下一页</button>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="btnSpeak">讲解本页</button>
        <button type="button" class="btn" id="btnListen">连续聆听</button>
        <button type="button" class="btn" id="btnResume">继续讲解</button>
        <button type="button" class="btn danger" id="btnStop">停止</button>
      </div>
      <div class="panel"><h2>讲解脚本</h2><p class="script" id="scriptText">—</p></div>
      <div class="panel"><h2>常见问题（也可直接问）</h2><div class="faq-list" id="faqList"></div></div>
      <div class="panel">
        <h2>对话</h2>
        <div class="transcript" id="transcript">等待语音输入…</div>
        <div class="reply" id="reply" hidden></div>
      </div>
      <details class="panel settings">
        <summary>可选：接入 LLM（回答更灵活）</summary>
        <label>API Base</label>
        <input type="text" id="apiBase" placeholder="https://api.openai.com/v1" />
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
        <label>Model</label>
        <input type="text" id="apiModel" value="gpt-4o-mini" />
        <label class="toggle-row"><input type="checkbox" id="autoResume" checked /> 答完自动续讲剩余内容</label>
      </details>
    </aside>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const PROJECT = params.get("project") || "nsgf-publication";
    const BASE = `projects/${PROJECT}/`;
    const TTS_API = (() => {
      const q = params.get("tts_api");
      if (q) return q.replace(/\/$/, "");
      if (location.hostname === "write.insynbio.com") return `${location.origin}/ppt-voice-api`;
      if (location.hostname.includes("insynbio.com")) return "https://write.insynbio.com/ppt-voice-api";
      return "";
    })();
    const SILENT_WAV = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
    const State = { IDLE: "idle", LISTENING: "listening", SPEAKING: "speaking", THINKING: "thinking" };

    let state = State.IDLE;
    let deck = { title: "", slides: [] };
    let slides = [];
    let currentSlide = 0;
    let listenEnabled = false;
    let abortCtrl = null;
    let speakGen = 0;
    let narration = { active: false, parts: [], index: 0 };
    let lastSpokenChunk = "";
    let ttsStartedAt = 0;
    let handlingQuestion = false;
    const player = new Audio();
    player.preload = "auto";
    let audioCtx = null;
    let useCloudTts = true;
    let ttsPrefetch = { gen: 0, cache: new Map() };
    let audioPrimed = false;
    let lastPlayError = "";

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    const $ = (id) => document.getElementById(id);

    const RESUME_RE = /^(继续|接着讲|继续讲|继续讲解|go on|continue|接着说|往下讲)/i;
    const NEXT_RE = /^(下一页|下一张|next)/i;
    const PREV_RE = /^(上一页|上一张|previous|back)/i;
    const STOP_RE = /^(停止|暂停|别说了|stop)/i;

    function setState(s, hint, labelOverride) {
      state = s;
      $("statusDot").className = "dot " + s;
      const labels = { idle: "待命", listening: "聆听中", speaking: "播报中", thinking: "思考中" };
      $("statusLabel").textContent = labelOverride || labels[s] || s;
      if (hint !== undefined) $("statusHint").textContent = hint;
    }

    function getZhVoice() {
      return synth.getVoices().find((v) => v.lang.startsWith("zh")) || null;
    }

    function splitSentences(text) {
      return text.split(/(?<=[。！？；\n])/g).map((s) => s.trim()).filter(Boolean);
    }

    /** Fewer TTS round-trips → less pause between phrases */
    function chunkForTts(text, maxLen = 320) {
      const sentences = splitSentences(text);
      const chunks = [];
      let buf = "";
      for (const s of sentences) {
        if (buf && (buf + s).length > maxLen) {
          chunks.push(buf);
          buf = s;
        } else {
          buf += s;
        }
      }
      if (buf) chunks.push(buf);
      return chunks.length ? chunks : [text];
    }

    function normalize(s) {
      return (s || "").toLowerCase().replace(/[\s？?，,。.！!；;：:""''（）()]/g, "");
    }

    function tokens(s) {
      const t = new Set();
      (s || "").replace(/[a-zA-Z0-9]+/g, (m) => t.add(m.toLowerCase()));
      (s || "").replace(/[\u4e00-\u9fff]{2,}/g, (m) => { for (let i = 0; i < m.length - 1; i++) t.add(m.slice(i, i + 2)); });
      return t;
    }

    function showError(msg) {
      lastPlayError = msg || "";
      const el = $("unsupported");
      if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
      el.style.display = "block";
      el.textContent = msg;
    }

    /** Must run synchronously inside click — before any await — or browser blocks play() */
    function primePlayerOnClick() {
      if (audioPrimed) return;
      try {
        player.muted = true;
        player.src = SILENT_WAV;
        const p = player.play();
        if (p && typeof p.then === "function") {
          p.then(() => {
            player.pause();
            player.currentTime = 0;
            player.muted = false;
            audioPrimed = true;
          }).catch((e) => console.warn("prime play", e));
        } else {
          audioPrimed = true;
          player.muted = false;
        }
      } catch (e) {
        console.warn("primePlayer", e);
      }
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (_) {}
    }

    function stopPlayer() {
      player.pause();
      player.removeAttribute("src");
      player.load();
    }

    function clearTtsPrefetch(gen) {
      for (const v of ttsPrefetch.cache.values()) {
        if (typeof v === "string") URL.revokeObjectURL(v);
      }
      ttsPrefetch.cache.clear();
      ttsPrefetch.gen = gen;
    }

    function mergeAbortSignals() {
      const signals = [abortCtrl?.signal, typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(90000) : null].filter(Boolean);
      if (!signals.length) return undefined;
      if (signals.length === 1) return signals[0];
      return typeof AbortSignal.any === "function" ? AbortSignal.any(signals) : signals[0];
    }

    async function fetchCloudAudioUrl(sentence, gen) {
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      const res = await fetch(`${TTS_API}/speak`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: sentence, voice: "onyx", model: "tts-1-hd", speed: 1.0 }),
        signal: mergeAbortSignals(),
      });
      if (!res.ok) throw new Error(`TTS ${res.status}`);
      const blob = await res.blob();
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      return URL.createObjectURL(blob);
    }

    function prefetchCloudChunk(sentence, key, gen) {
      if (!useCloudTts || !TTS_API || ttsPrefetch.cache.has(key)) return;
      ttsPrefetch.cache.set(
        key,
        fetchCloudAudioUrl(sentence, gen).catch((e) => {
          ttsPrefetch.cache.delete(key);
          throw e;
        })
      );
    }

    async function playBlobUrl(url, gen) {
      if (gen !== speakGen) { URL.revokeObjectURL(url); throw new DOMException("Aborted", "AbortError"); }
      stopPlayer();
      player.src = url;
      player.currentTime = 0;
      player.muted = false;
      ttsStartedAt = Date.now();
      try {
        await player.play();
      } catch (e) {
        if (audioCtx) {
          try {
            const res = await fetch(url);
            const buf = await res.arrayBuffer();
            const audioBuf = await audioCtx.decodeAudioData(buf.slice(0));
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(audioCtx.destination);
            await new Promise((resolve, reject) => {
              if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
              src.onended = resolve;
              src.start(0);
            });
            return;
          } catch (webErr) {
            console.warn("WebAudio fallback", webErr);
          }
        }
        throw new Error(e.name === "NotAllowedError"
          ? "浏览器阻止播放：请再点一次「讲解本页」，并确认页面标签未被静音"
          : `播放失败 (${e.name || e.message})`);
      }
      await new Promise((resolve, reject) => {
        if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
        player.onended = () => resolve();
        player.onerror = () => reject(new Error("audio element error"));
      });
    }

    async function speakOneCloud(sentence, gen, cacheKey, progressHint) {
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      synth.cancel();
      lastSpokenChunk = sentence;
      if (progressHint) setState(State.SPEAKING, progressHint + " · 合成中…", "讲解中");
      let url;
      const cached = cacheKey != null ? ttsPrefetch.cache.get(cacheKey) : null;
      if (cached) {
        ttsPrefetch.cache.delete(cacheKey);
        url = await cached;
      } else {
        url = await fetchCloudAudioUrl(sentence, gen);
      }
      if (progressHint) setState(State.SPEAKING, progressHint + " · 播放中", "讲解中");
      await playBlobUrl(url, gen);
      URL.revokeObjectURL(url);
    }

    function speakOneBrowser(sentence, gen) {
      return new Promise((resolve, reject) => {
        if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
        synth.cancel();
        lastSpokenChunk = sentence;
        const u = new SpeechSynthesisUtterance(sentence);
        u.lang = "zh-CN";
        u.rate = 1.1;
        const voice = getZhVoice();
        if (voice) u.voice = voice;
        u.onstart = () => { ttsStartedAt = Date.now(); };
        u.onend = () => resolve();
        u.onerror = (e) => (e.error === "interrupted" ? reject(new DOMException("Aborted", "AbortError")) : reject(e));
        synth.speak(u);
      });
    }

    async function speakOne(sentence, gen, cacheKey, progressHint) {
      if (useCloudTts && TTS_API) {
        try {
          await speakOneCloud(sentence, gen, cacheKey, progressHint);
          showError("");
          return;
        } catch (e) {
          if (e.name === "AbortError") throw e;
          console.warn("cloud TTS", e);
          showError(String(e.message || e));
        }
      }
      setState(State.SPEAKING, "浏览器语音播放中…", "讲解中");
      await speakOneBrowser(sentence, gen);
      showError("");
    }

    function speakingHint(trackNarration) {
      if (trackNarration && listenEnabled) return "可随时提问 · 答完自动续讲";
      if (trackNarration) return "播放中 · 提问请先点「连续聆听」";
      return "播报中";
    }

    async function speakParts(parts, { trackNarration = false, startAt = 0 } = {}) {
      const gen = ++speakGen;
      abortCtrl = new AbortController();
      clearTtsPrefetch(gen);
      if (trackNarration) {
        narration = { active: true, parts, index: startAt };
      }
      const speakLabel = trackNarration ? "讲解中" : "播报中";
      setState(State.SPEAKING, speakingHint(trackNarration), speakLabel);
      try {
        for (let i = startAt; i < parts.length; i++) {
          if (abortCtrl.signal.aborted || gen !== speakGen) break;
          if (trackNarration) narration.index = i;
          const progress = parts.length > 1 ? `第 ${i + 1}/${parts.length} 段` : "";
          if (useCloudTts && TTS_API && i + 1 < parts.length) {
            prefetchCloudChunk(parts[i + 1], `${gen}:${i + 1}`, gen);
          }
          await speakOne(parts[i], gen, `${gen}:${i}`, progress);
        }
        if (gen === speakGen && trackNarration) narration.active = false;
      } catch (e) {
        if (e.name !== "AbortError") {
          console.warn(e);
          if (gen === speakGen) setState(State.IDLE, e.message || "播放失败，请重试");
        }
      } finally {
        if (gen === speakGen) {
          clearTtsPrefetch(gen);
          synth.cancel();
          stopPlayer();
          setState(listenEnabled ? State.LISTENING : State.IDLE, listenEnabled ? "请提问" : "讲解结束 · 可翻页或继续讲解");
        }
      }
    }

    async function speakStream(text, opts) {
      return speakParts(chunkForTts(text), opts);
    }

    function hardStop(clearNarration = true) {
      speakGen++;
      clearTtsPrefetch(speakGen);
      abortCtrl?.abort();
      synth.cancel();
      stopPlayer();
      if (clearNarration) narration.active = false;
      setState(listenEnabled ? State.LISTENING : State.IDLE);
    }

    function interruptForQuestion() {
      speakGen++;
      clearTtsPrefetch(speakGen);
      abortCtrl?.abort();
      synth.cancel();
      stopPlayer();
    }

    async function resumeNarration() {
      if (!narration.active || narration.index >= narration.parts.length) {
        const script = slides[currentSlide]?.script;
        if (script) return speakStream(script, { trackNarration: true, startAt: 0 });
        return;
      }
      await speakParts(narration.parts, { trackNarration: true, startAt: narration.index });
    }

    function slideImageUrl(slide, index) {
      const rel = slide?.image || `slides/slide_${String(index + 1).padStart(2, "0")}.png`;
      return BASE + rel;
    }

    function renderSlide() {
      const slide = slides[currentSlide];
      $("slideIndex").textContent = currentSlide + 1;
      $("slideTotal").textContent = slides.length;
      $("scriptText").textContent = slide?.script || "—";
      $("slideTitle").textContent = slide?.title || `Slide ${currentSlide + 1}`;
      $("slideImage").src = slideImageUrl(slide, currentSlide);
      $("slideImage").alt = slide?.title || `Slide ${currentSlide + 1}`;
      const faqEl = $("faqList");
      faqEl.innerHTML = "";
      (slide?.faq || []).forEach((item) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "faq-chip";
        chip.textContent = item.q;
        chip.addEventListener("click", () => handleUserText(item.q, { fromClick: true }));
        faqEl.appendChild(chip);
      });
      narration = { active: false, parts: [], index: 0 };
    }

    function scoreFaq(userText, item) {
      const u = normalize(userText);
      const q = normalize(item.q);
      if (!u || u.length < 2) return 0;
      if (u.includes(q) || q.includes(u)) return 100;
      let score = 0;
      const ut = tokens(userText);
      const qt = tokens(item.q);
      const at = tokens(item.a);
      for (const t of ut) {
        if (qt.has(t)) score += 3;
        if (at.has(t)) score += 2;
      }
      for (const kw of extractKeywords(item.q)) {
        if (u.includes(normalize(kw))) score += 5;
      }
      return score;
    }

    function extractKeywords(q) {
      const kws = [];
      const m = q.match(/[A-Za-z0-9]{2,}/g);
      if (m) kws.push(...m);
      q.replace(/[A-Za-z0-9\s？?，,。.！!]/g, " ").split(/\s+/).filter((w) => w.length >= 2).forEach((w) => kws.push(w));
      return kws;
    }

    function matchFaq(text) {
      const slide = slides[currentSlide];
      const items = slide?.faq || [];
      let best = null, bestScore = 0;
      for (const item of items) {
        const s = scoreFaq(text, item);
        if (s > bestScore) { bestScore = s; best = item; }
      }
      if (best && bestScore >= 4) return best.a;

      for (const item of items) {
        for (const kw of extractKeywords(item.q + item.a)) {
          if (text.toLowerCase().includes(kw.toLowerCase()) || normalize(text).includes(normalize(kw))) {
            return item.a;
          }
        }
      }
      return null;
    }

    function answerFromScript(text) {
      const slide = slides[currentSlide];
      const script = slide?.script || "";
      if (!script) return null;
      const parts = splitSentences(script);
      const ut = tokens(text);
      let best = null, bestScore = 0;
      for (const p of parts) {
        let s = 0;
        for (const t of ut) if (tokens(p).has(t)) s++;
        if (s > bestScore) { bestScore = s; best = p; }
      }
      if (best && bestScore >= 2) return best;
      if (parts.length) return `根据本页内容：${parts[0]}`;
      return null;
    }

    function buildLiveAnswer(text) {
      return matchFaq(text) || answerFromScript(text) ||
        `关于「${text.slice(0, 20)}」，本页重点是：${(slides[currentSlide]?.script || "").slice(0, 120)}… 如需更细节我们可以会后展开。`;
    }

    async function askLLM(userText) {
      const base = $("apiBase").value.trim().replace(/\/$/, "");
      const key = $("apiKey").value.trim();
      const model = $("apiModel").value.trim() || "gpt-4o-mini";
      if (!base || !key) return null;
      const slide = slides[currentSlide];
      const system = [
        "你是现场 PPT 讲解员，必须当场回答，禁止说「以后再答」「会后讨论」。",
        "口语化，最多 3 句话，只基于本页脚本和 FAQ。",
        `第 ${currentSlide + 1} 页：${slide?.title || ""}`,
        `脚本：${slide?.script || ""}`,
        `FAQ：${(slide?.faq || []).map((f) => f.q + "→" + f.a).join("；")}`,
      ].join("\n");
      const res = await fetch(`${base}/chat/completions`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
        body: JSON.stringify({
          model, stream: false, max_tokens: 200,
          messages: [{ role: "system", content: system }, { role: "user", content: userText }],
        }),
        signal: abortCtrl?.signal,
      });
      if (!res.ok) throw new Error(`LLM ${res.status}`);
      const j = await res.json();
      return j.choices?.[0]?.message?.content?.trim() || null;
    }

    function isEcho(text) {
      if (!text || text.length < 2) return true;
      if (state === State.SPEAKING && Date.now() - ttsStartedAt < 2200) return true;
      const n = normalize(text);
      const chunk = normalize(lastSpokenChunk);
      if (chunk && chunk.length > 6 && (chunk.includes(n) || n.includes(chunk.slice(0, Math.min(12, chunk.length))))) return true;
      return false;
    }

    async function handleUserText(text, { fromClick = false } = {}) {
      if (!text?.trim() || handlingQuestion) return;
      if (!fromClick && isEcho(text)) return;

      text = text.trim();

      if (RESUME_RE.test(text)) { interruptForQuestion(); await resumeNarration(); return; }
      if (NEXT_RE.test(text)) { hardStop(true); $("btnNext").click(); return; }
      if (PREV_RE.test(text)) { hardStop(true); $("btnPrev").click(); return; }
      if (STOP_RE.test(text)) { hardStop(true); return; }

      const wasNarrating = narration.active && narration.index < narration.parts.length;
      interruptForQuestion();

      handlingQuestion = true;
      $("reply").hidden = false;
      $("reply").textContent = "正在思考…";
      setState(State.THINKING, "理解您的问题…");
      abortCtrl = new AbortController();

      let answer = matchFaq(text);
      try {
        if (!answer) answer = await askLLM(text);
      } catch (e) {
        if (e.name === "AbortError") { handlingQuestion = false; return; }
        console.warn(e);
      }
      if (!answer) answer = buildLiveAnswer(text);

      $("reply").textContent = "答：" + answer;
      await speakParts([answer]);

      if ($("autoResume").checked && wasNarrating) {
        await speakParts(["好，我继续讲。"]);
        await resumeNarration();
      } else if (wasNarrating) {
        setState(listenEnabled ? State.LISTENING : State.IDLE, "说「继续」可接着讲");
      }
      handlingQuestion = false;
    }

    function initRecognition() {
      if (!SpeechRecognition) {
        $("unsupported").style.display = "block";
        $("unsupported").textContent = "请使用 Chrome 或 Edge 以启用语音识别。";
        $("btnListen").disabled = true;
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "zh-CN";

      recognition.onresult = (ev) => {
        let interim = "", final = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        if (final && final.trim().length >= 2) {
          const ft = final.trim();
          $("transcript").innerHTML = `<span class="final">${escapeHtml(ft)}</span>`;
          if (state === State.SPEAKING && listenEnabled && !isEcho(ft)) {
            interruptForQuestion();
          }
          if (listenEnabled) handleUserText(ft);
        } else if (interim && listenEnabled) {
          $("transcript").innerHTML = `<span class="interim">${escapeHtml(interim)}</span>`;
        }
      };
      recognition.onerror = (e) => {
        if (e.error !== "no-speech" && e.error !== "aborted") console.warn(e.error);
      };
      recognition.onend = () => {
        if (listenEnabled) try { recognition.start(); } catch (_) {}
      };
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function toggleListen() {
      listenEnabled = !listenEnabled;
      const btn = $("btnListen");
      if (listenEnabled) {
        btn.textContent = "停止聆听";
        btn.classList.add("primary");
        setState(State.LISTENING, "请提问 — 打断后会现场回答");
        try { recognition.start(); } catch (_) {}
      } else {
        btn.textContent = "连续聆听";
        btn.classList.remove("primary");
        recognition?.stop();
        setState(State.IDLE);
      }
    }

    async function loadDeck() {
      const res = await fetch(`${BASE}slides.json`, { cache: "no-store" });
      if (!res.ok) throw new Error(`无法加载 ${BASE}slides.json`);
      deck = await res.json();
      slides = deck.slides || [];
      $("deckTitle").textContent = deck.title || PROJECT;
      $("deckSub").textContent = `${slides.length} 页 · 打断问答 + 自动续讲`;
      document.title = (deck.title || "PPT") + " · 语音播放器";
      currentSlide = 0;
      renderSlide();
    }

    $("btnPrev").addEventListener("click", () => { hardStop(true); currentSlide = Math.max(0, currentSlide - 1); renderSlide(); });
    $("btnNext").addEventListener("click", () => { hardStop(true); currentSlide = Math.min(slides.length - 1, currentSlide + 1); renderSlide(); });
    $("btnSpeak").addEventListener("click", () => {
      const s = slides[currentSlide]?.script;
      if (!s) {
        showError("本页没有讲解脚本，请检查 slides.json");
        return;
      }
      primePlayerOnClick();
      showError("");
      speakStream(s, { trackNarration: true, startAt: 0 });
    });
    $("btnListen").addEventListener("click", toggleListen);
    $("btnResume").addEventListener("click", () => resumeNarration());
    $("btnStop").addEventListener("click", () => hardStop(true));

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") $("btnNext").click();
      if (e.key === "ArrowLeft") $("btnPrev").click();
      if (e.key === " ") { e.preventDefault(); $("btnSpeak").click(); }
      if (e.key === "Escape") hardStop(true);
    });

    speechSynthesis.onvoiceschanged = () => getZhVoice();
    initRecognition();
    loadDeck().then(async () => {
      if (TTS_API) {
        try {
          const h = await fetch(`${TTS_API}/health`);
          const j = await h.json();
          if (j.has_key) $("deckSub").textContent += " · 云端语音 OK";
          else $("deckSub").textContent += " · 云端语音未配置，用浏览器音";
        } catch (_) {
          useCloudTts = false;
        }
      }
    }).catch((e) => { $("deckSub").textContent = "加载失败：" + e.message; console.error(e); });
  </script>
</body>
</html>
