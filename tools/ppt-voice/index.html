<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPT 语音播放器</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2332; --border: #2d3a4f; --text: #e8edf4;
      --muted: #8b9cb3; --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b;
      --danger: #ef4444; --speaking: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
    .layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; max-width: 1280px; margin: 0 auto; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    h1 { font-size: 1.15rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.82rem; margin: 4px 0 12px; }
    .slide-stage { background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
    .slide-stage img { width: 100%; height: 100%; object-fit: contain; }
    .slide-title { margin-top: 10px; font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .status-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.idle { background: var(--muted); }
    .dot.listening { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.2s infinite; }
    .dot.speaking { background: var(--speaking); box-shadow: 0 0 8px var(--speaking); animation: pulse 0.8s infinite; }
    .dot.thinking { background: var(--warn); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .status-text { font-size: 0.85rem; }
    .status-text small { color: var(--muted); display: block; margin-top: 2px; font-size: 0.75rem; }
    .slide-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .slide-nav button, .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; }
    .slide-nav button:hover, .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { border-color: var(--danger); color: var(--danger); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .slide-num { flex: 1; text-align: center; font-weight: 600; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .actions .span2 { grid-column: span 2; }
    .actions .btn { width: 100%; text-align: center; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .panel h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .script { line-height: 1.6; font-size: 0.88rem; max-height: 160px; overflow-y: auto; }
    .faq-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .faq-chip { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px; font-size: 0.75rem; cursor: pointer; }
    .faq-chip:hover { border-color: var(--accent); }
    .transcript { min-height: 56px; font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .transcript .final { color: var(--text); }
    .transcript .interim { opacity: 0.6; font-style: italic; }
    .reply { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--accent); font-size: 0.85rem; }
    .settings summary { cursor: pointer; color: var(--muted); font-size: 0.82rem; }
    .settings label { display: block; font-size: 0.75rem; color: var(--muted); margin: 8px 0 4px; }
    .settings input { width: 100%; padding: 7px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.82rem; }
    .settings select { width: 100%; padding: 7px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.82rem; }
    .voice-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .voice-row select { flex: 1; }
    .voice-row .btn { flex-shrink: 0; padding: 7px 10px; }
    .unsupported { color: var(--danger); font-size: 0.82rem; display: none; margin-bottom: 8px; padding: 8px 10px; background: rgba(239,68,68,0.12); border-radius: 8px; line-height: 1.45; }
    .hint { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
    .hint code { color: var(--accent); }
    .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
    .voice-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; font-size: 0.82rem; }
    .voice-bar span { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .voice-bar .btn { flex-shrink: 0; padding: 6px 12px; }
    .modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.65); }
    .modal-box { position: relative; width: min(420px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.45); }
    .modal-box h3 { font-size: 1rem; margin-bottom: 12px; }
    .voice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .voice-card {
      position: relative; padding: 12px 12px 12px 36px; background: #243044; border: 2px solid #3d4f6a;
      border-radius: 8px; cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      color: var(--text);
    }
    .voice-card:not(.selected):hover { border-color: #6b8cae; background: #2a3850; }
    .voice-card.selected {
      border-color: #3b82f6; background: rgba(59,130,246,0.22);
      box-shadow: 0 0 0 1px rgba(59,130,246,0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .voice-card.selected:hover { border-color: #60a5fa; }
    .voice-card .mark {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid #6b8cae;
      background: transparent; font-size: 0.65rem; line-height: 14px; text-align: center; color: transparent;
    }
    .voice-card.selected .mark { border-color: #3b82f6; background: #3b82f6; color: #fff; }
    .voice-card .name { font-size: 0.88rem; font-weight: 600; display: block; color: #f1f5f9; }
    .voice-card .id { font-size: 0.72rem; color: #94a3b8; margin-top: 3px; display: block; }
    .voice-card.selected .name { color: #fff; }
    .voice-card.selected .id { color: #bfdbfe; }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    .modal-actions .btn { flex: 1; }
    .modal-options label { display: block; font-size: 0.75rem; color: var(--muted); margin: 8px 0 4px; }
    .modal-options select { width: 100%; padding: 7px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="layout">
    <section>
      <h1 id="deckTitle">PPT 语音播放器</h1>
      <p class="sub" id="deckSub">幻灯片 + 语音讲解 + 可打断问答</p>
      <div class="slide-stage"><img id="slideImage" alt="当前幻灯片" /></div>
      <p class="slide-title" id="slideTitle">—</p>
      <p class="hint">← → 翻页 · 空格全场演讲 · Esc 停止</p>
    </section>
    <aside>
      <p class="unsupported" id="unsupported"></p>
      <div class="status-bar">
        <div class="dot idle" id="statusDot"></div>
        <div class="status-text">
          <span id="statusLabel">待命</span>
          <small id="statusHint">线上使用 OpenAI 语音（无需 MiniMax）；本地可浏览器备用</small>
        </div>
      </div>
      <div class="slide-nav">
        <button type="button" id="btnPrev">上一页</button>
        <div class="slide-num"><span id="slideIndex">1</span> / <span id="slideTotal">1</span></div>
        <button type="button" id="btnNext">下一页</button>
      </div>
      <div class="actions">
        <button type="button" class="btn primary span2" id="btnPresent">全场演讲</button>
        <button type="button" class="btn" id="btnSpeak">讲本页</button>
        <button type="button" class="btn" id="btnContinue" hidden>继续</button>
        <button type="button" class="btn" id="btnRestart" hidden>重新讲解</button>
        <button type="button" class="btn" id="btnListen">提问</button>
        <button type="button" class="btn danger" id="btnStop">停止</button>
      </div>
      <div class="voice-bar">
        <span id="voiceCurrentLabel">播音员：onyx · 男声 · 稳重</span>
        <button type="button" class="btn" id="btnOpenVoiceModal">选择播音员</button>
      </div>
      <div class="panel"><h2>讲解脚本</h2><p class="script" id="scriptText">—</p></div>
      <div class="panel"><h2>常见问题（也可直接问）</h2><div class="faq-list" id="faqList"></div></div>
      <div class="panel">
        <h2>对话</h2>
        <div class="transcript" id="transcript">等待语音输入…</div>
        <div class="reply" id="reply" hidden></div>
      </div>
      <details class="panel settings">
        <summary>可选：接入 LLM（回答更灵活）</summary>
        <label>API Base</label>
        <input type="text" id="apiBase" placeholder="https://api.openai.com/v1" />
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
        <label>Model</label>
        <input type="text" id="apiModel" value="gpt-4o-mini" />
        <label class="toggle-row"><input type="checkbox" id="autoResume" checked /> 答完自动续讲剩余内容</label>
        <label class="toggle-row"><input type="checkbox" id="qaAutoListen" checked /> 演讲/讲本页时自动开麦克风</label>
      </details>
    </aside>
  </div>
  <div id="voiceModal" class="modal" hidden role="dialog" aria-labelledby="voiceModalTitle" aria-modal="true">
    <div class="modal-backdrop" id="voiceModalBackdrop"></div>
    <div class="modal-box">
      <h3 id="voiceModalTitle">选择播音员（OpenAI · 6 位）</h3>
      <div class="voice-grid" id="voiceGrid" role="radiogroup" aria-label="播音员"></div>
      <div class="modal-options">
        <label>音质</label>
        <select id="ttsModelSelect">
          <option value="tts-1">快速 (tts-1) · 推荐</option>
          <option value="tts-1-hd">高音质 (tts-1-hd)</option>
        </select>
        <label>语速</label>
        <select id="ttsSpeedSelect">
          <option value="0.92">较慢 0.92</option>
          <option value="1.0">正常 1.0</option>
          <option value="1.05" selected>稍快 1.05 · 推荐</option>
          <option value="1.08">更快 1.08</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnVoicePreview">试听</button>
        <button type="button" class="btn primary" id="btnVoiceConfirm">确定</button>
        <button type="button" class="btn" id="btnVoiceClose">取消</button>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const PROJECT = params.get("project") || "nsgf-publication";
    const BASE = `projects/${PROJECT}/`;
    const TTS_API = (() => {
      const q = params.get("tts_api");
      if (q) return q.replace(/\/$/, "");
      if (location.hostname === "write.insynbio.com") return `${location.origin}/ppt-voice-api`;
      if (location.hostname.includes("insynbio.com")) return "https://write.insynbio.com/ppt-voice-api";
      return "";
    })();
    const SILENT_WAV = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
    const TTS_VOICES = ["onyx", "echo", "fable", "alloy", "nova", "shimmer"];
    const VOICE_LABELS = {
      onyx: "男声 · 稳重",
      echo: "男声 · 清晰",
      fable: "叙事 · 英式",
      alloy: "中性 · 通用",
      nova: "女声 · 明亮",
      shimmer: "女声 · 柔和",
    };
    let ttsVoice = (() => {
      const fromUrl = params.get("voice")?.toLowerCase();
      if (fromUrl && TTS_VOICES.includes(fromUrl)) return fromUrl;
      const saved = localStorage.getItem("ppt-voice-voice");
      if (saved && TTS_VOICES.includes(saved)) return saved;
      return "onyx";
    })();
    let ttsModel = (() => {
      const q = params.get("tts_model");
      if (q === "tts-1-hd" || q === "tts-1") return q;
      const saved = localStorage.getItem("ppt-voice-model");
      if (saved === "tts-1-hd" || saved === "tts-1") return saved;
      return "tts-1";
    })();
    let ttsSpeed = (() => {
      const fromUrl = parseFloat(params.get("speed") || "");
      if (!Number.isNaN(fromUrl)) return Math.min(2, Math.max(0.5, fromUrl));
      const saved = parseFloat(localStorage.getItem("ppt-voice-speed") || "");
      if (!Number.isNaN(saved)) return Math.min(2, Math.max(0.5, saved));
      return 1.05;
    })();
    const SLIDE_PAUSE_MS = 250;
    const TTS_MAX_CHARS = 4096;
    const State = { IDLE: "idle", LISTENING: "listening", SPEAKING: "speaking", THINKING: "thinking" };

    let state = State.IDLE;
    let deck = { title: "", slides: [] };
    let slides = [];
    let currentSlide = 0;
    let listenEnabled = false;
    let abortCtrl = null;
    let speakGen = 0;
    let narration = { active: false, parts: [], index: 0 };
    let lastSpokenChunk = "";
    let ttsStartedAt = 0;
    let handlingQuestion = false;
    const player = new Audio();
    player.preload = "auto";
    let audioCtx = null;
    let useCloudTts = true;
    let ttsPrefetch = { gen: 0, cache: new Map() };
    let audioPrimed = false;
    let lastPlayError = "";
    let presentation = { active: false };
    let qaAutoListen = localStorage.getItem("ppt-voice-qa-auto") !== "0";

    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    const $ = (id) => document.getElementById(id);

    const RESUME_RE = /^(继续|接着讲|继续讲|继续讲解|go on|continue|接着说|往下讲)/i;
    const NEXT_RE = /^(下一页|下一张|next)/i;
    const PREV_RE = /^(上一页|上一张|previous|back)/i;
    const STOP_RE = /^(停止|暂停|别说了|stop)/i;

    function setState(s, hint, labelOverride) {
      state = s;
      $("statusDot").className = "dot " + s;
      const labels = { idle: "待命", listening: "聆听中", speaking: "播报中", thinking: "思考中" };
      $("statusLabel").textContent = labelOverride || labels[s] || s;
      if (hint !== undefined) $("statusHint").textContent = hint;
      updateActionButtons();
    }

    function updateActionButtons() {
      const canContinue = narration.active && narration.index < narration.parts.length && state !== State.SPEAKING;
      const speaking = state === State.SPEAKING;
      $("btnContinue").hidden = !canContinue;
      $("btnSpeak").hidden = canContinue || speaking;
      $("btnRestart").hidden = !speaking && !canContinue;
      $("btnPresent").textContent = presentation.active ? "停止演讲" : "全场演讲";
      $("btnPresent").classList.toggle("primary", !presentation.active);
      $("btnPresent").classList.toggle("danger", presentation.active);
      $("btnListen").textContent = listenEnabled ? "停止提问" : "提问";
      $("btnListen").classList.toggle("primary", listenEnabled);
    }

    function getZhVoice() {
      return synth.getVoices().find((v) => v.lang.startsWith("zh")) || null;
    }

    function splitSentences(text) {
      return text.split(/(?<=[。！？；\n])/g).map((s) => s.trim()).filter(Boolean);
    }

    /** One API call per slide when script fits in TTS_MAX_CHARS */
    function chunkForTts(text, maxLen = TTS_MAX_CHARS) {
      if (!text || text.length <= maxLen) return [text];
      const sentences = splitSentences(text);
      const chunks = [];
      let buf = "";
      for (const s of sentences) {
        if (buf && (buf + s).length > maxLen) {
          chunks.push(buf);
          buf = s;
        } else {
          buf += s;
        }
      }
      if (buf) chunks.push(buf);
      return chunks.length ? chunks : [text];
    }

    function normalize(s) {
      return (s || "").toLowerCase().replace(/[\s？?，,。.！!；;：:""''（）()]/g, "");
    }

    function tokens(s) {
      const t = new Set();
      (s || "").replace(/[a-zA-Z0-9]+/g, (m) => t.add(m.toLowerCase()));
      (s || "").replace(/[\u4e00-\u9fff]{2,}/g, (m) => { for (let i = 0; i < m.length - 1; i++) t.add(m.slice(i, i + 2)); });
      return t;
    }

    function showError(msg) {
      lastPlayError = msg || "";
      const el = $("unsupported");
      if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
      el.style.display = "block";
      el.textContent = msg;
    }

    /** Must run synchronously inside click — before any await — or browser blocks play() */
    function primePlayerOnClick() {
      if (audioPrimed) return;
      try {
        player.muted = true;
        player.src = SILENT_WAV;
        const p = player.play();
        if (p && typeof p.then === "function") {
          p.then(() => {
            player.pause();
            player.currentTime = 0;
            player.muted = false;
            audioPrimed = true;
          }).catch((e) => console.warn("prime play", e));
        } else {
          audioPrimed = true;
          player.muted = false;
        }
      } catch (e) {
        console.warn("primePlayer", e);
      }
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (_) {}
    }

    function stopPlayer() {
      player.pause();
      player.removeAttribute("src");
      player.load();
    }

    function clearTtsPrefetch(gen) {
      for (const v of ttsPrefetch.cache.values()) {
        if (typeof v === "string") URL.revokeObjectURL(v);
      }
      ttsPrefetch.cache.clear();
      ttsPrefetch.gen = gen;
    }

    function mergeAbortSignals() {
      const signals = [abortCtrl?.signal, typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(90000) : null].filter(Boolean);
      if (!signals.length) return undefined;
      if (signals.length === 1) return signals[0];
      return typeof AbortSignal.any === "function" ? AbortSignal.any(signals) : signals[0];
    }

    async function fetchCloudAudioPrefetch(text) {
      const res = await fetch(`${TTS_API}/speak`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice: ttsVoice, model: ttsModel, speed: ttsSpeed }),
        signal: typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(90000) : undefined,
      });
      if (!res.ok) throw new Error(`TTS ${res.status}`);
      const blob = await res.blob();
      return URL.createObjectURL(blob);
    }

    async function fetchCloudAudioUrl(sentence, gen) {
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      const res = await fetch(`${TTS_API}/speak`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: sentence, voice: ttsVoice, model: ttsModel, speed: ttsSpeed }),
        signal: mergeAbortSignals(),
      });
      if (!res.ok) throw new Error(`TTS ${res.status}`);
      const blob = await res.blob();
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      return URL.createObjectURL(blob);
    }

    function prefetchSlideAudio(slideIndex) {
      if (slideIndex < 0 || slideIndex >= slides.length || !useCloudTts || !TTS_API) return;
      const script = slides[slideIndex]?.script;
      if (!script) return;
      const key = `slide:${slideIndex}`;
      if (ttsPrefetch.cache.has(key)) return;
      ttsPrefetch.cache.set(
        key,
        fetchCloudAudioPrefetch(script).catch((e) => {
          ttsPrefetch.cache.delete(key);
          throw e;
        })
      );
    }

    function prefetchCloudChunk(sentence, key, gen) {
      if (!useCloudTts || !TTS_API || ttsPrefetch.cache.has(key)) return;
      ttsPrefetch.cache.set(
        key,
        fetchCloudAudioUrl(sentence, gen).catch((e) => {
          ttsPrefetch.cache.delete(key);
          throw e;
        })
      );
    }

    async function playBlobUrl(url, gen) {
      if (gen !== speakGen) { URL.revokeObjectURL(url); throw new DOMException("Aborted", "AbortError"); }
      stopPlayer();
      player.src = url;
      player.currentTime = 0;
      player.muted = false;
      ttsStartedAt = Date.now();
      try {
        await player.play();
      } catch (e) {
        if (audioCtx) {
          try {
            const res = await fetch(url);
            const buf = await res.arrayBuffer();
            const audioBuf = await audioCtx.decodeAudioData(buf.slice(0));
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(audioCtx.destination);
            await new Promise((resolve, reject) => {
              if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
              src.onended = resolve;
              src.start(0);
            });
            return;
          } catch (webErr) {
            console.warn("WebAudio fallback", webErr);
          }
        }
        throw new Error(e.name === "NotAllowedError"
          ? "浏览器阻止播放：请再点一次「讲解本页」，并确认页面标签未被静音"
          : `播放失败 (${e.name || e.message})`);
      }
      await new Promise((resolve, reject) => {
        if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
        player.onended = () => resolve();
        player.onerror = () => reject(new Error("audio element error"));
      });
    }

    async function speakOneCloud(sentence, gen, cacheKey, progressHint) {
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      synth.cancel();
      lastSpokenChunk = sentence;
      if (progressHint) setState(State.SPEAKING, progressHint + " · 合成中…", "讲解中");
      let url;
      const cached = cacheKey != null ? ttsPrefetch.cache.get(cacheKey) : null;
      if (cached) {
        ttsPrefetch.cache.delete(cacheKey);
        url = await cached;
      } else {
        url = await fetchCloudAudioUrl(sentence, gen);
      }
      if (progressHint) setState(State.SPEAKING, progressHint + " · 播放中", "讲解中");
      await playBlobUrl(url, gen);
      URL.revokeObjectURL(url);
    }

    function speakOneBrowser(sentence, gen) {
      return new Promise((resolve, reject) => {
        if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
        synth.cancel();
        lastSpokenChunk = sentence;
        const u = new SpeechSynthesisUtterance(sentence);
        u.lang = "zh-CN";
        u.rate = 1.1;
        const voice = getZhVoice();
        if (voice) u.voice = voice;
        u.onstart = () => { ttsStartedAt = Date.now(); };
        u.onend = () => resolve();
        u.onerror = (e) => (e.error === "interrupted" ? reject(new DOMException("Aborted", "AbortError")) : reject(e));
        synth.speak(u);
      });
    }

    async function speakOne(sentence, gen, cacheKey, progressHint) {
      if (useCloudTts && TTS_API) {
        try {
          await speakOneCloud(sentence, gen, cacheKey, progressHint);
          showError("");
          return;
        } catch (e) {
          if (e.name === "AbortError") throw e;
          console.warn("cloud TTS", e);
          showError(String(e.message || e));
        }
      }
      setState(State.SPEAKING, "浏览器语音播放中…", "讲解中");
      await speakOneBrowser(sentence, gen);
      showError("");
    }

    function speakingHint(trackNarration) {
      if (trackNarration && listenEnabled) return "可随时语音提问 · 答完自动续讲";
      if (trackNarration) return "播放中 · 点「提问」可打断";
      return "播报中";
    }

    function ensureListen(on, hint) {
      if (on && !listenEnabled) {
        listenEnabled = true;
        try { recognition?.start(); } catch (_) {}
        updateActionButtons();
      }
      if (hint && listenEnabled) setState(state, hint);
    }

    async function speakParts(parts, { trackNarration = false, startAt = 0, deckLabel = "", slideIndex = null } = {}) {
      const gen = ++speakGen;
      abortCtrl = new AbortController();
      if (startAt === 0) clearTtsPrefetch(gen);
      if (trackNarration) {
        narration = { active: true, parts, index: startAt };
      }
      const speakLabel = deckLabel || (trackNarration ? "讲解中" : "播报中");
      setState(State.SPEAKING, speakingHint(trackNarration), speakLabel);
      let finishedAll = false;
      try {
        let spoke = 0;
        for (let i = startAt; i < parts.length; i++) {
          if (abortCtrl.signal.aborted || gen !== speakGen) break;
          if (trackNarration) narration.index = i;
          const progress = parts.length > 1 ? `第 ${i + 1}/${parts.length} 段` : "";
          const cacheKey = slideIndex != null && parts.length === 1 ? `slide:${slideIndex}` : `${gen}:${i}`;
          if (slideIndex != null && presentation.active) {
            prefetchSlideAudio(slideIndex + 1);
          } else if (useCloudTts && TTS_API && i + 1 < parts.length) {
            prefetchCloudChunk(parts[i + 1], `${gen}:${i + 1}`, gen);
          }
          await speakOne(parts[i], gen, cacheKey, progress);
          spoke++;
        }
        finishedAll = gen === speakGen && spoke === parts.length - startAt && parts.length > 0;
        if (gen === speakGen && trackNarration && finishedAll) narration.active = false;
      } catch (e) {
        if (e.name !== "AbortError") {
          console.warn(e);
          if (gen === speakGen) setState(State.IDLE, e.message || "播放失败，请重试");
        }
      } finally {
        if (gen === speakGen) {
          clearTtsPrefetch(gen);
          synth.cancel();
          stopPlayer();
          if (!presentation.active) {
            setState(listenEnabled ? State.LISTENING : State.IDLE, listenEnabled ? "请提问" : "讲解结束 · 可翻页或继续讲解");
          }
        }
      }
      return finishedAll && gen === speakGen;
    }

    async function speakStream(text, opts = {}) {
      return speakParts(chunkForTts(text), opts);
    }

    function updatePresentButton() {
      updateActionButtons();
    }

    function speakCurrentSlide({ restart = false } = {}) {
      const s = slides[currentSlide]?.script;
      if (!s) {
        showError("本页没有讲解脚本，请检查 slides.json");
        return;
      }
      if (restart) {
        speakGen++;
        clearTtsPrefetch(speakGen);
        abortCtrl?.abort();
        synth.cancel();
        stopPlayer();
        narration = { active: false, parts: [], index: 0 };
      }
      presentation.active = false;
      updateActionButtons();
      primePlayerOnClick();
      showError("");
      if (qaAutoListen) ensureListen(true);
      speakStream(s, { trackNarration: true, startAt: 0, slideIndex: currentSlide });
    }

    function getDeckIntro() {
      if (deck.intro === "") return null;
      if (deck.intro) return deck.intro;
      const t = deck.title || "本次研究";
      return `各位好，欢迎参加今天的汇报。接下来我将为大家介绍${t}。讲解过程中如有疑问，欢迎随时提问，我会尽力当场解答。现在我们开始。`;
    }

    function getDeckOutro() {
      if (deck.outro === "") return null;
      if (deck.outro) return deck.outro;
      return `以上是我的汇报内容，感谢各位的聆听。现在进入提问环节，欢迎大家就任何相关内容提出问题，我很乐意与您进一步讨论。`;
    }

    async function speakAside(text, hint, label = "演讲") {
      if (!text || !presentation.active) return true;
      setState(State.SPEAKING, hint, label);
      return speakStream(text, { deckLabel: label });
    }

    async function speakOutroIfNeeded() {
      const outro = getDeckOutro();
      if (!outro || !presentation.active) {
        endPresentation("全部讲完 · 感谢聆听");
        return;
      }
      await delay(200);
      const ok = await speakAside(outro, "结束语 · 欢迎提问", "结束");
      if (!presentation.active || !ok) return;
      const wantQa = listenEnabled;
      endPresentation("汇报结束 · 欢迎提问");
      if (!wantQa) toggleListen();
      else setState(State.LISTENING, "提问环节 · 请直接说话或点常见问题");
    }

    function endPresentation(msg) {
      presentation.active = false;
      updatePresentButton();
      setState(listenEnabled ? State.LISTENING : State.IDLE, msg || "演讲结束");
    }

    async function presentSlide(slideIndex) {
      if (!presentation.active || slideIndex >= slides.length) {
        endPresentation(slideIndex >= slides.length ? "全部讲完 · 感谢聆听" : "演讲已停止");
        return;
      }
      currentSlide = slideIndex;
      renderSlide();
      const script = slides[slideIndex]?.script;
      if (!script) return presentSlide(slideIndex + 1);

      setState(State.SPEAKING, `第 ${slideIndex + 1}/${slides.length} 页 · 自动翻页`, "演讲");
      prefetchSlideAudio(slideIndex);
      const done = await speakStream(script, {
        trackNarration: true, startAt: 0, deckLabel: "演讲", slideIndex,
      });
      if (!presentation.active) return;
      if (!done) return;

      if (slideIndex >= slides.length - 1) {
        await speakOutroIfNeeded();
        return;
      }
      await delay(SLIDE_PAUSE_MS);
      return presentSlide(slideIndex + 1);
    }

    async function startPresentation(from = currentSlide) {
      presentation.active = true;
      updatePresentButton();
      primePlayerOnClick();
      showError("");
      if (qaAutoListen) ensureListen(true);
      prefetchSlideAudio(from);
      if (from === 0) {
        const intro = getDeckIntro();
        if (intro) {
          currentSlide = 0;
          renderSlide();
          prefetchSlideAudio(0);
          const ok = await speakAside(intro, "开场白", "开场");
          if (!presentation.active || !ok) return;
          await delay(SLIDE_PAUSE_MS);
        }
      }
      await presentSlide(from);
    }

    async function continuePresentationIfNeeded() {
      if (!presentation.active || narration.active) return;
      const next = currentSlide + 1;
      if (next >= slides.length) {
        await speakOutroIfNeeded();
        return;
      }
      await delay(SLIDE_PAUSE_MS);
      await presentSlide(next);
    }

    function hardStop(clearNarration = true) {
      presentation.active = false;
      updatePresentButton();
      speakGen++;
      clearTtsPrefetch(speakGen);
      abortCtrl?.abort();
      synth.cancel();
      stopPlayer();
      if (clearNarration) narration.active = false;
      setState(listenEnabled ? State.LISTENING : State.IDLE);
    }

    function interruptForQuestion() {
      speakGen++;
      clearTtsPrefetch(speakGen);
      abortCtrl?.abort();
      synth.cancel();
      stopPlayer();
    }

    async function resumeNarration() {
      if (!narration.active || narration.index >= narration.parts.length) {
        const script = slides[currentSlide]?.script;
        if (script) return speakStream(script, { trackNarration: true, startAt: 0 });
        return;
      }
      await speakParts(narration.parts, { trackNarration: true, startAt: narration.index });
    }

    function slideImageUrl(slide, index) {
      const rel = slide?.image || `slides/slide_${String(index + 1).padStart(2, "0")}.png`;
      return BASE + rel;
    }

    function renderSlide() {
      const slide = slides[currentSlide];
      $("slideIndex").textContent = currentSlide + 1;
      $("slideTotal").textContent = slides.length;
      $("scriptText").textContent = slide?.script || "—";
      $("slideTitle").textContent = slide?.title || `Slide ${currentSlide + 1}`;
      $("slideImage").src = slideImageUrl(slide, currentSlide);
      $("slideImage").alt = slide?.title || `Slide ${currentSlide + 1}`;
      const faqEl = $("faqList");
      faqEl.innerHTML = "";
      (slide?.faq || []).forEach((item) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "faq-chip";
        chip.textContent = item.q;
        chip.addEventListener("click", () => handleUserText(item.q, { fromClick: true }));
        faqEl.appendChild(chip);
      });
      narration = { active: false, parts: [], index: 0 };
      updateActionButtons();
    }

    function scoreFaq(userText, item) {
      const u = normalize(userText);
      const q = normalize(item.q);
      if (!u || u.length < 2) return 0;
      if (u.includes(q) || q.includes(u)) return 100;
      let score = 0;
      const ut = tokens(userText);
      const qt = tokens(item.q);
      const at = tokens(item.a);
      for (const t of ut) {
        if (qt.has(t)) score += 3;
        if (at.has(t)) score += 2;
      }
      for (const kw of extractKeywords(item.q)) {
        if (u.includes(normalize(kw))) score += 5;
      }
      return score;
    }

    function extractKeywords(q) {
      const kws = [];
      const m = q.match(/[A-Za-z0-9]{2,}/g);
      if (m) kws.push(...m);
      q.replace(/[A-Za-z0-9\s？?，,。.！!]/g, " ").split(/\s+/).filter((w) => w.length >= 2).forEach((w) => kws.push(w));
      return kws;
    }

    function matchFaq(text) {
      const slide = slides[currentSlide];
      const items = slide?.faq || [];
      let best = null, bestScore = 0;
      for (const item of items) {
        const s = scoreFaq(text, item);
        if (s > bestScore) { bestScore = s; best = item; }
      }
      if (best && bestScore >= 4) return best.a;

      for (const item of items) {
        for (const kw of extractKeywords(item.q + item.a)) {
          if (text.toLowerCase().includes(kw.toLowerCase()) || normalize(text).includes(normalize(kw))) {
            return item.a;
          }
        }
      }
      return null;
    }

    function answerFromScript(text) {
      const slide = slides[currentSlide];
      const script = slide?.script || "";
      if (!script) return null;
      const parts = splitSentences(script);
      const ut = tokens(text);
      let best = null, bestScore = 0;
      for (const p of parts) {
        let s = 0;
        for (const t of ut) if (tokens(p).has(t)) s++;
        if (s > bestScore) { bestScore = s; best = p; }
      }
      if (best && bestScore >= 2) return best;
      if (parts.length) return `根据本页内容：${parts[0]}`;
      return null;
    }

    function buildLiveAnswer(text) {
      return matchFaq(text) || answerFromScript(text) ||
        `关于「${text.slice(0, 20)}」，本页重点是：${(slides[currentSlide]?.script || "").slice(0, 120)}… 如需更细节我们可以会后展开。`;
    }

    async function askLLM(userText) {
      const base = $("apiBase").value.trim().replace(/\/$/, "");
      const key = $("apiKey").value.trim();
      const model = $("apiModel").value.trim() || "gpt-4o-mini";
      if (!base || !key) return null;
      const slide = slides[currentSlide];
      const system = [
        "你是现场 PPT 讲解员，必须当场回答，禁止说「以后再答」「会后讨论」。",
        "口语化，最多 3 句话，只基于本页脚本和 FAQ。",
        `第 ${currentSlide + 1} 页：${slide?.title || ""}`,
        `脚本：${slide?.script || ""}`,
        `FAQ：${(slide?.faq || []).map((f) => f.q + "→" + f.a).join("；")}`,
      ].join("\n");
      const res = await fetch(`${base}/chat/completions`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
        body: JSON.stringify({
          model, stream: false, max_tokens: 200,
          messages: [{ role: "system", content: system }, { role: "user", content: userText }],
        }),
        signal: abortCtrl?.signal,
      });
      if (!res.ok) throw new Error(`LLM ${res.status}`);
      const j = await res.json();
      return j.choices?.[0]?.message?.content?.trim() || null;
    }

    function isEcho(text) {
      if (!text || text.length < 2) return true;
      if (state === State.SPEAKING && Date.now() - ttsStartedAt < 1200) return true;
      const n = normalize(text);
      const chunk = normalize(lastSpokenChunk);
      if (!chunk || chunk.length < 8) return false;
      // Whole-slide TTS: do not block real questions that share keywords with script
      if (chunk.length > 80) {
        return n.length >= 12 && chunk.includes(n) && n.length / chunk.length > 0.55;
      }
      if (chunk === n) return true;
      if (n.length >= 10 && chunk.includes(n)) return true;
      return false;
    }

    function shouldInterrupt(text) {
      if (!text || text.length < 2 || !listenEnabled || state !== State.SPEAKING) return false;
      if (isEcho(text)) return false;
      if (RESUME_RE.test(text) || STOP_RE.test(text) || NEXT_RE.test(text) || PREV_RE.test(text)) return true;
      return text.trim().length >= 2;
    }

    async function handleUserText(text, { fromClick = false } = {}) {
      if (!text?.trim() || handlingQuestion) return;
      if (!fromClick && isEcho(text)) return;

      text = text.trim();

      if (RESUME_RE.test(text)) {
        interruptForQuestion();
        await resumeNarration();
        await continuePresentationIfNeeded();
        return;
      }
      if (NEXT_RE.test(text)) { hardStop(true); $("btnNext").click(); return; }
      if (PREV_RE.test(text)) { hardStop(true); $("btnPrev").click(); return; }
      if (STOP_RE.test(text)) { hardStop(true); return; }

      const wasNarrating = narration.active && narration.index < narration.parts.length;
      interruptForQuestion();

      handlingQuestion = true;
      $("reply").hidden = false;
      $("reply").textContent = "正在思考…";
      setState(State.THINKING, "理解您的问题…");
      abortCtrl = new AbortController();

      let answer = matchFaq(text);
      try {
        if (!answer) answer = await askLLM(text);
      } catch (e) {
        if (e.name === "AbortError") { handlingQuestion = false; return; }
        console.warn(e);
      }
      if (!answer) answer = buildLiveAnswer(text);

      $("reply").textContent = "答：" + answer;
      await speakParts([answer]);

      if ($("autoResume").checked && wasNarrating) {
        await speakParts(["好，我继续讲。"]);
        await resumeNarration();
        await continuePresentationIfNeeded();
      } else if (wasNarrating) {
        setState(listenEnabled ? State.LISTENING : State.IDLE, "说「继续」可接着讲");
      }
      handlingQuestion = false;
    }

    function initRecognition() {
      if (!SpeechRecognition) {
        $("unsupported").style.display = "block";
        $("unsupported").textContent = "请使用 Chrome 或 Edge 以启用语音识别。";
        $("btnListen").disabled = true;
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "zh-CN";

      recognition.onresult = (ev) => {
        let interim = "", final = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        const live = (final || interim).trim();
        if (live && listenEnabled) {
          if (shouldInterrupt(live) && state === State.SPEAKING) {
            interruptForQuestion();
          }
        }
        if (final && final.trim().length >= 2) {
          const ft = final.trim();
          $("transcript").innerHTML = `<span class="final">${escapeHtml(ft)}</span>`;
          if (listenEnabled) handleUserText(ft);
        } else if (interim && listenEnabled) {
          $("transcript").innerHTML = `<span class="interim">${escapeHtml(interim)}</span>`;
        }
      };
      recognition.onerror = (e) => {
        if (e.error === "not-allowed") {
          showError("麦克风未授权：请在浏览器地址栏允许麦克风，再点「提问」");
          listenEnabled = false;
          updateActionButtons();
        } else if (e.error !== "no-speech" && e.error !== "aborted") {
          console.warn(e.error);
        }
      };
      recognition.onend = () => {
        if (listenEnabled) try { recognition.start(); } catch (_) {}
      };
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function toggleListen() {
      const turningOn = !listenEnabled;
      if (turningOn && state === State.SPEAKING) {
        interruptForQuestion();
      }
      listenEnabled = turningOn;
      if (listenEnabled) {
        setState(State.LISTENING, "请提问 — 可直接说话打断");
        try { recognition.start(); } catch (_) {}
      } else {
        recognition?.stop();
        setState(State.IDLE, "提问已关闭");
      }
      updateActionButtons();
    }

    function appendVoiceToSub() {
      const base = $("deckSub").textContent.replace(/ · 播音员：.*$/, "").replace(/ · 云端语音 OK · .*$/, "");
      $("deckSub").textContent = `${base} · 播音员：${ttsVoice}（${VOICE_LABELS[ttsVoice] || ttsVoice}）`;
    }

    function updateVoiceLabel() {
      const el = $("voiceCurrentLabel");
      if (el) el.textContent = `播音员：${ttsVoice} · ${VOICE_LABELS[ttsVoice] || ttsVoice}`;
      appendVoiceToSub();
    }

    function openVoiceModal() {
      $("voiceModal").hidden = false;
      renderVoiceCards();
      $("ttsModelSelect").value = ttsModel;
      $("ttsSpeedSelect").value = String(ttsSpeed);
    }

    function closeVoiceModal() {
      $("voiceModal").hidden = true;
    }

    function selectVoice(id) {
      if (!TTS_VOICES.includes(id)) return;
      ttsVoice = id;
      localStorage.setItem("ppt-voice-voice", ttsVoice);
      renderVoiceCards();
      updateVoiceLabel();
    }

    function renderVoiceCards() {
      const grid = $("voiceGrid");
      grid.innerHTML = "";
      for (const id of TTS_VOICES) {
        const selected = id === ttsVoice;
        const card = document.createElement("button");
        card.type = "button";
        card.className = "voice-card" + (selected ? " selected" : "");
        card.setAttribute("role", "radio");
        card.setAttribute("aria-checked", selected ? "true" : "false");
        card.innerHTML = `<span class="mark" aria-hidden="true">${selected ? "✓" : ""}</span><span class="name">${VOICE_LABELS[id]}</span><span class="id">${id}</span>`;
        card.addEventListener("click", () => selectVoice(id));
        grid.appendChild(card);
      }
    }

    function initVoicePicker() {
      $("ttsModelSelect").value = ttsModel;
      const speedSel = $("ttsSpeedSelect");
      if (!["0.92", "1.0", "1.05", "1.08"].includes(String(ttsSpeed))) {
        speedSel.innerHTML = `<option value="${ttsSpeed}">自定义 ${ttsSpeed}</option>` +
          `<option value="0.92">较慢 0.92</option><option value="1.0">正常 1.0</option><option value="1.05">稍快 1.05</option><option value="1.08">更快 1.08</option>`;
      }
      speedSel.value = String(ttsSpeed);
      updateVoiceLabel();
      $("btnOpenVoiceModal").addEventListener("click", openVoiceModal);
      $("btnVoiceClose").addEventListener("click", closeVoiceModal);
      $("voiceModalBackdrop").addEventListener("click", closeVoiceModal);
      $("btnVoiceConfirm").addEventListener("click", closeVoiceModal);
      $("ttsModelSelect").addEventListener("change", (e) => {
        ttsModel = e.target.value;
        localStorage.setItem("ppt-voice-model", ttsModel);
      });
      speedSel.addEventListener("change", (e) => {
        ttsSpeed = parseFloat(e.target.value) || 1.0;
        localStorage.setItem("ppt-voice-speed", String(ttsSpeed));
      });
      $("btnVoicePreview").addEventListener("click", () => {
        presentation.active = false;
        primePlayerOnClick();
        speakParts(["各位好，这是当前播音员试听。"], { deckLabel: "试听" });
      });
    }

    async function loadDeck() {
      const res = await fetch(`${BASE}slides.json`, { cache: "no-store" });
      if (!res.ok) throw new Error(`无法加载 ${BASE}slides.json`);
      deck = await res.json();
      slides = deck.slides || [];
      $("deckTitle").textContent = deck.title || PROJECT;
      $("deckSub").textContent = `${slides.length} 页 · 全场演讲自动翻页 · 可打断问答`;
      document.title = (deck.title || "PPT") + " · 语音播放器";
      currentSlide = 0;
      renderSlide();
    }

    $("btnPrev").addEventListener("click", () => { hardStop(true); currentSlide = Math.max(0, currentSlide - 1); renderSlide(); });
    $("btnNext").addEventListener("click", () => { hardStop(true); currentSlide = Math.min(slides.length - 1, currentSlide + 1); renderSlide(); });
    $("btnPresent").addEventListener("click", () => {
      if (presentation.active) { hardStop(true); return; }
      startPresentation(currentSlide);
    });
    $("btnSpeak").addEventListener("click", () => speakCurrentSlide());
    $("btnContinue").addEventListener("click", async () => {
      await resumeNarration();
      await continuePresentationIfNeeded();
    });
    $("btnRestart").addEventListener("click", () => speakCurrentSlide({ restart: true }));
    $("btnListen").addEventListener("click", toggleListen);
    $("btnStop").addEventListener("click", () => hardStop(true));

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (!$("voiceModal").hidden) { closeVoiceModal(); return; }
        hardStop(true);
        return;
      }
      if (e.key === "ArrowRight") $("btnNext").click();
      if (e.key === "ArrowLeft") $("btnPrev").click();
      if (e.key === " ") { e.preventDefault(); $("btnPresent").click(); }
    });

    speechSynthesis.onvoiceschanged = () => getZhVoice();
    initRecognition();
    initVoicePicker();
    $("qaAutoListen").checked = qaAutoListen;
    $("qaAutoListen").addEventListener("change", (e) => {
      qaAutoListen = e.target.checked;
      localStorage.setItem("ppt-voice-qa-auto", qaAutoListen ? "1" : "0");
    });
    loadDeck().then(async () => {
      if (TTS_API) {
        try {
          const h = await fetch(`${TTS_API}/health`);
          const j = await h.json();
          if (j.has_key) appendVoiceToSub();
          else $("deckSub").textContent += " · 云端未配置，用浏览器音";
        } catch (_) {
          useCloudTts = false;
        }
      } else {
        appendVoiceToSub();
      }
    }).catch((e) => { $("deckSub").textContent = "加载失败：" + e.message; console.error(e); });
  </script>
</body>
</html>
