  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const PROJECT = params.get("project") || "nsgf-publication";
    const BASE = `projects/${PROJECT}/`;
    const TTS_API = (() => {
      const q = params.get("tts_api");
      if (q) return q.replace(/\/$/, "");
      if (location.hostname === "write.insynbio.com") return `${location.origin}/ppt-voice-api`;
      if (location.hostname.includes("insynbio.com")) return "https://write.insynbio.com/ppt-voice-api";
      return "";
    })();
    const SILENT_WAV = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
    const TTS_VOICES = ["onyx", "echo", "fable", "alloy", "nova", "shimmer", "shuangkuaisisi", "yunzhou", "dayi", "liuchangnv"];
    const VOICE_LABELS = {
      onyx: "男声 · 稳重",
      echo: "男声 · 清晰",
      fable: "叙事 · 英式",
      alloy: "中性 · 通用",
      nova: "女声 · 明亮",
      shimmer: "女声 · 柔和",
      shuangkuaisisi: "爽快思思 · 活泼",
      yunzhou: "云舟 · 活力",
      dayi: "大壹 · 磁性",
      liuchangnv: "流畅女声 · 亲切",
    };
    let ttsVoice = (() => {
      const fromUrl = params.get("voice")?.toLowerCase();
      if (fromUrl && TTS_VOICES.includes(fromUrl)) return fromUrl;
      const saved = localStorage.getItem("ppt-voice-voice");
      if (saved && TTS_VOICES.includes(saved)) return saved;
      return "onyx";
    })();
    let ttsModel = (() => {
      const q = params.get("tts_model");
      if (q === "tts-1-hd" || q === "tts-1") return q;
      const saved = localStorage.getItem("ppt-voice-model");
      if (saved === "tts-1-hd" || saved === "tts-1") return saved;
      return "tts-1";
    })();
    let ttsSpeed = (() => {
      const fromUrl = parseFloat(params.get("speed") || "");
      if (!Number.isNaN(fromUrl)) return Math.min(2, Math.max(0.5, fromUrl));
      const saved = parseFloat(localStorage.getItem("ppt-voice-speed") || "");
      if (!Number.isNaN(saved)) return Math.min(2, Math.max(0.5, saved));
      return 1.05;
    })();
    const SLIDE_PAUSE_MS = 100;
    const SLIDE_QA_PAUSE_MS = 800;
    const QA_SENTENCE_GAP_MS = 600;
    const NARR_GROUP_TARGET = 200;
    const NARR_GROUP_MIN = 90;
    const QA_IDLE_CLOSE_MS = 30_000;
    const TTS_MAX_CHARS = 4096;
    const State = { IDLE: "idle", LISTENING: "listening", SPEAKING: "speaking", THINKING: "thinking" };

    let state = State.IDLE;
    let deck = { title: "", slides: [] };
    let slides = [];
    let currentSlide = 0;
    let listenEnabled = false;
    let pttActive = false;
    let pttFinalParts = [];
    let pttInterim = "";
    let abortCtrl = null;
    let speakGen = 0;
    let narration = { active: false, parts: [], index: 0 };
    let lastSpokenChunk = "";
    let ttsStartedAt = 0;
    let handlingQuestion = false;
    const player = new Audio();
    player.preload = "auto";
    player.ontimeupdate = () => {
      if (state === State.SPEAKING && narration.active && showPointer) {
        const currentPartProgress = player.duration ? player.currentTime / player.duration : 0;
        const numParts = narration.parts.length || 1;
        const partIdx = narration.index;
        const overallProgress = (partIdx + currentPartProgress) / numParts;
        setDocPointerProgress(overallProgress);
      }
    };
    let audioCtx = null;
    let useCloudTts = true;
    let consecutiveTtsFailures = 0;
    let ttsPrefetch = { gen: 0, cache: new Map() };
    let audioPrimed = false;
    let lastPlayError = "";
    let presentation = { active: false };
    let presAdvanceTaken = false;
    let pointerTimer = null;
    let pointerIdx = 0;
    // Reading-order sweep path across a typical slide (top row L→R, then bottom row L→R).
    const POINTER_PATH = [
      { x: 24, y: 30 }, { x: 42, y: 28 }, { x: 60, y: 30 }, { x: 78, y: 30 },
      { x: 24, y: 60 }, { x: 42, y: 62 }, { x: 60, y: 60 }, { x: 78, y: 60 },
    ];
    let currentTheme = localStorage.getItem("ppt-voice-theme") || "dark";
    document.documentElement.setAttribute("data-theme", currentTheme);
    let showPresenter = localStorage.getItem("ppt-voice-show-presenter") !== "0";
    let showPointer = localStorage.getItem("ppt-voice-show-pointer") !== "0";
    let qaAutoListen = localStorage.getItem("ppt-voice-qa-auto") !== "0";
    let micResumeTimer = null;
    let qaIdleTimer = null;
    let qaIdleTickTimer = null;
    let qaIdleDeadline = 0;
    let postExplainQaOpen = false;
    const qaHistory = [];

    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    const synth = window.speechSynthesis || {
      speak: () => {},
      cancel: () => {},
      pause: () => {},
      resume: () => {},
      getVoices: () => []
    };
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    const $ = (id) => document.getElementById(id);

    const RESUME_RE = /^(继续|接着讲|继续讲|继续讲解|go on|continue|接着说|往下讲)/i;
    const NEXT_RE = /^(下一页|下一张|next)/i;
    const PREV_RE = /^(上一页|上一张|previous|back)/i;
    const STOP_RE = /^(停止|暂停|别说了|stop)/i;

    function setState(s, hint, labelOverride) {
      state = s;
      $("statusDot").className = "dot " + s;
      const labels = { idle: "待命", listening: "聆听中", speaking: "播报中", thinking: "思考中" };
      $("statusLabel").textContent = labelOverride || labels[s] || s;
      if (hint !== undefined) $("statusHint").textContent = hint;
      updatePresenterAvatar(s);
      updateActionButtons();
      syncMicWithState();
    }

    // Move the highlight to a fixed path waypoint (forward-only, calm).
    function placeDocPointer(idx) {
      const spot = $("highlightSpot");
      const pres = $("presenter");
      if (!spot || !pres) return;
      const path = POINTER_PATH;
      const t = path[Math.min(path.length - 1, Math.max(0, idx))];
      spot.hidden = false;
      spot.style.left = `${t.x}%`;
      spot.style.top = `${t.y}%`;
      pres.style.setProperty("--arm-rot", `${-38 - t.x * 0.45}deg`);
    }

    function startDocPointing() {
      stopDocPointing();
      if (!showPointer) return;
      pointerIdx = 0;
      placeDocPointer(pointerIdx);
    }

    function setDocPointerProgress(progress) {
      if (!showPointer || state !== State.SPEAKING) return;
      const idx = Math.max(0, Math.min(POINTER_PATH.length - 1, Math.round(progress * (POINTER_PATH.length - 1))));
      if (idx === pointerIdx) return;
      pointerIdx = idx;
      placeDocPointer(pointerIdx);
    }

    function stopDocPointing() {
      clearInterval(pointerTimer);
      pointerTimer = null;
      pointerIdx = 0;
      const spot = $("highlightSpot");
      if (spot) spot.hidden = true;
      const pres = $("presenter");
      if (pres) pres.style.setProperty("--arm-rot", "-55deg");
    }

    function updatePresenterAvatar(s) {
      const el = $("presenter");
      const badge = $("presenterBadge");
      const st = s || state;
      if (!el) return;
      el.className = "presenter " + st;
      el.style.display = showPresenter ? "" : "none";
      const badges = {
        idle: "小博士",
        listening: "在听您说",
        speaking: "讲解中",
        thinking: "思考中",
      };
      if (badge) badge.textContent = badges[st] || "小博士";
      
      if (st === State.SPEAKING) startDocPointing();
      else stopDocPointing();
    }

    function updateQaCountdownUi() {
      const sec = qaIdleDeadline
        ? Math.max(0, Math.ceil((qaIdleDeadline - Date.now()) / 1000))
        : Math.round(QA_IDLE_CLOSE_MS / 1000);
      const cd = $("qaCountdown");
      if (cd) cd.textContent = String(sec);
      const hint = $("statusHint");
      if (postExplainQaOpen && hint) hint.textContent = qaIdleHintText();
    }

    function showQaBanner(show) {
      const banner = $("qaBanner");
      if (banner) banner.classList.toggle("active", Boolean(show));
    }

    function qaIdleHintText() {
      const sec = qaIdleDeadline
        ? Math.max(0, Math.ceil((qaIdleDeadline - Date.now()) / 1000))
        : Math.round(QA_IDLE_CLOSE_MS / 1000);
      return `提问环节 · ${sec} 秒无提问将自动结束`;
    }

    function cancelQaIdleClose() {
      clearTimeout(qaIdleTimer);
      clearInterval(qaIdleTickTimer);
      qaIdleTimer = null;
      qaIdleTickTimer = null;
      qaIdleDeadline = 0;
      showQaBanner(false);
    }

    function startQaIdleClose() {
      cancelQaIdleClose();
      postExplainQaOpen = true;
      listenEnabled = true;
      updateActionButtons();
      qaIdleDeadline = Date.now() + QA_IDLE_CLOSE_MS;
      showQaBanner(true);
      updateQaCountdownUi();
      setState(State.LISTENING, qaIdleHintText(), "提问环节");
      $("askInput")?.focus({ preventScroll: true });
      clearTimeout(micResumeTimer);
      try { recognition?.stop(); } catch (_) {}
      micResumeTimer = setTimeout(() => {
        if (listenEnabled && state !== State.SPEAKING && state !== State.THINKING) {
          try { recognition.start(); } catch (e) { console.warn("mic", e); }
        }
      }, 300);
      qaIdleTickTimer = setInterval(updateQaCountdownUi, 500);
      qaIdleTimer = setTimeout(() => autoCloseAfterQa(), QA_IDLE_CLOSE_MS);
    }

    function bumpQaIdleClose() {
      if (!postExplainQaOpen) return;
      startQaIdleClose();
    }

    async function autoCloseAfterQa() {
      cancelQaIdleClose();
      postExplainQaOpen = false;
      listenEnabled = false;
      recognition?.stop();
      presentation.active = false;
      narration.active = false;
      updateActionButtons();
      setState(State.SPEAKING, "结束语…", "结束");
      try {
        await speakParts(["感谢各位聆听，本次讲解结束，再见。"], { deckLabel: "结束" });
      } catch (_) {}
      setSlideCaption("");
      stopDocPointing();
      $("transcript").textContent = "讲解已结束";
      $("reply").textContent = "";
      $("reply").classList.add("empty");
      setState(State.IDLE, "30 秒无提问 · 已自动结束");
    }

    function finishPresentationWithQa() {
      endPresentation("全部讲完 · 进入提问环节");
      startQaIdleClose();
    }

    function pauseMicForTts() {
      clearTimeout(micResumeTimer);
      try { recognition?.stop(); } catch (_) {}
    }

    function syncMicWithState() {
      if (!recognition || pttActive) return;
      clearTimeout(micResumeTimer);
      const shouldListen = (listenEnabled || postExplainQaOpen) && state !== State.THINKING && state !== State.SPEAKING;
      if (!shouldListen) {
        try { recognition.stop(); } catch (_) {}
        return;
      }
      micResumeTimer = setTimeout(() => {
        if ((listenEnabled || postExplainQaOpen) && state !== State.SPEAKING && state !== State.THINKING) {
          try { recognition.start(); } catch (e) { console.warn("mic start", e); }
        }
      }, 150);
    }

    function updateActionButtons() {
      const canContinue = narration.active && narration.index < narration.parts.length && state !== State.SPEAKING;
      const speaking = state === State.SPEAKING;
      const speakBtn = $("btnSpeak");
      const listenBtn = $("btnListen");
      if (canContinue) {
        speakBtn.textContent = "继续";
        speakBtn.classList.add("primary");
      } else if (speaking) {
        speakBtn.textContent = "重新讲解";
        speakBtn.classList.remove("primary");
      } else {
        speakBtn.textContent = "讲本页";
        speakBtn.classList.remove("primary");
      }
      $("btnPresent").textContent = presentation.active ? "停止演讲" : "全场演讲";
      $("btnPresent").classList.toggle("primary", !presentation.active);
      $("btnPresent").classList.toggle("danger", presentation.active);
      if (listenBtn) {
        listenBtn.textContent = listenEnabled ? "🎤 聆听中·点此结束" : "🎤 提问";
        listenBtn.classList.toggle("primary", listenEnabled);
        listenBtn.hidden = false;
      }
      speakBtn.hidden = presentation.active && speaking && !canContinue;
      $("btnStop").hidden = presentation.active || (state === State.IDLE && !listenEnabled);
    }

    function initLlmConfig() {
      const fromUrl = {
        base: params.get("api_base") || params.get("apiBase") || "",
        key: params.get("api_key") || params.get("apiKey") || "",
        model: params.get("api_model") || params.get("model") || "",
      };
      const stored = {
        base: localStorage.getItem("ppt-voice-api-base") || "",
        key: localStorage.getItem("ppt-voice-api-key") || "",
        model: localStorage.getItem("ppt-voice-api-model") || "",
      };
      $("apiBase").value = fromUrl.base || stored.base || "https://api.openai.com/v1";
      $("apiKey").value = fromUrl.key || stored.key || "";
      $("apiModel").value = fromUrl.model || stored.model || "gpt-4o-mini";
      if (fromUrl.base) localStorage.setItem("ppt-voice-api-base", fromUrl.base);
      if (fromUrl.key) localStorage.setItem("ppt-voice-api-key", fromUrl.key);
      if (fromUrl.model) localStorage.setItem("ppt-voice-api-model", fromUrl.model);
    }

    async function syncLlmFromServer() {
      if (!TTS_API) return;
      try {
        const h = await fetch(`${TTS_API}/health`);
        const j = await h.json();
        if (j.api_base) $("apiBase").value = j.api_base;
        if (j.model) $("apiModel").value = j.model;
        if (j.has_key) {
          appendVoiceToSub();
          if (j.llm) $("deckSub").textContent += " · AI 问答已启用";
        } else {
          $("deckSub").textContent += " · 云端未配置，用浏览器音";
        }
      } catch (_) {
        useCloudTts = false;
      }
    }

    function handleSpeakClick() {
      const canContinue = narration.active && narration.index < narration.parts.length && state !== State.SPEAKING;
      if (canContinue) {
        resumeNarration().then(() => continuePresentationIfNeeded());
        return;
      }
      if (state === State.SPEAKING) {
        speakCurrentSlide({ restart: true });
        return;
      }
      speakCurrentSlide();
    }

    function getZhVoice() {
      const voices = synth.getVoices();
      const zhVoices = voices.filter((v) => v.lang.startsWith("zh") || v.lang.includes("CN") || v.lang.includes("ZH"));
      if (!zhVoices.length) return null;

      // Determine target gender based on selected cloud voice
      const isMaleTarget = ["onyx", "echo"].includes(ttsVoice);
      const isFemaleTarget = ["nova", "shimmer"].includes(ttsVoice);

      if (isMaleTarget) {
        // Try to find a male Chinese voice
        const maleVoice = zhVoices.find((v) => {
          const name = v.name.toLowerCase();
          return name.includes("kangkang") || name.includes("yunyang") || name.includes("yunjian") || name.includes("yunxi") || name.includes("sinji") || name.includes("male") || name.includes("男");
        });
        if (maleVoice) return maleVoice;
      } else if (isFemaleTarget) {
        // Try to find a female Chinese voice
        const femaleVoice = zhVoices.find((v) => {
          const name = v.name.toLowerCase();
          return name.includes("huihui") || name.includes("yaoyao") || name.includes("xiaoxiao") || name.includes("xiaoyi") || name.includes("tingting") || name.includes("meijia") || name.includes("female") || name.includes("女");
        });
        if (femaleVoice) return femaleVoice;
      }

      // If no gender-specific voice found, or target is neutral, try to find a high-quality one or just return the first one
      const preferred = zhVoices.find((v) => v.name.includes("Google") || v.name.includes("Microsoft") || v.name.includes("Natural"));
      return preferred || zhVoices[0];
    }

    function splitSentences(text) {
      return text.split(/(?<=[。！？\n])/g).map((s) => s.trim()).filter(Boolean);
    }

    /** Merge sentences into longer narration paragraphs (fewer TTS calls, smoother speech) */
    function groupForNarration(text, targetLen = NARR_GROUP_TARGET, minLen = NARR_GROUP_MIN) {
      const sentences = splitSentences(text);
      if (!sentences.length) return text ? [text] : [];
      if (sentences.length === 1) return sentences;
      const groups = [];
      let buf = "";
      for (const s of sentences) {
        if (!buf) {
          buf = s;
          continue;
        }
        if ((buf + s).length <= targetLen || buf.length < minLen) {
          buf += s;
        } else {
          groups.push(buf);
          buf = s;
        }
      }
      if (buf) groups.push(buf);
      return groups;
    }

    /** One API call per slide when script fits in TTS_MAX_CHARS */
    function chunkForTts(text, maxLen = TTS_MAX_CHARS) {
      if (!text || text.length <= maxLen) return [text];
      const sentences = splitSentences(text);
      const chunks = [];
      let buf = "";
      for (const s of sentences) {
        if (buf && (buf + s).length > maxLen) {
          chunks.push(buf);
          buf = s;
        } else {
          buf += s;
        }
      }
      if (buf) chunks.push(buf);
      return chunks.length ? chunks : [text];
    }

    function normalize(s) {
      return (s || "").toLowerCase().replace(/[\s？?，,。.！!；;：:""''（）()]/g, "");
    }

    function tokens(s) {
      const t = new Set();
      (s || "").replace(/[a-zA-Z0-9]+/g, (m) => t.add(m.toLowerCase()));
      (s || "").replace(/[\u4e00-\u9fff]{2,}/g, (m) => { for (let i = 0; i < m.length - 1; i++) t.add(m.slice(i, i + 2)); });
      return t;
    }

    function showError(msg) {
      lastPlayError = msg || "";
      const el = $("unsupported");
      if (!el) return;
      if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
      el.style.display = "block";
      el.textContent = msg;
    }

    /** Must run synchronously inside click — before any await — or browser blocks play() */
    function primePlayerOnClick() {
      if (audioPrimed) return;
      try {
        player.muted = true;
        player.src = SILENT_WAV;
        const p = player.play();
        if (p && typeof p.then === "function") {
          p.then(() => {
            player.pause();
            player.currentTime = 0;
            player.muted = false;
            audioPrimed = true;
          }).catch((e) => console.warn("prime play", e));
        } else {
          audioPrimed = true;
          player.muted = false;
        }
      } catch (e) {
        console.warn("primePlayer", e);
      }
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (_) {}
    }

    function stopPlayer() {
      player.onended = null;
      player.onerror = null;
      player.pause();
      player.removeAttribute("src");
      player.load();
    }

    function clearTtsPrefetch(gen) {
      for (const key of [...ttsPrefetch.cache.keys()]) {
        if (String(key).startsWith("slide:")) continue;
        const v = ttsPrefetch.cache.get(key);
        if (typeof v === "string") URL.revokeObjectURL(v);
        ttsPrefetch.cache.delete(key);
      }
      ttsPrefetch.gen = gen;
    }

    function mergeAbortSignals() {
      const signals = [abortCtrl?.signal, typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(12000) : null].filter(Boolean);
      if (!signals.length) return undefined;
      if (signals.length === 1) return signals[0];
      return typeof AbortSignal.any === "function" ? AbortSignal.any(signals) : signals[0];
    }

    async function fetchCloudAudioPrefetch(text) {
      const res = await fetch(`${TTS_API}/speak`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice: ttsVoice, model: ttsModel, speed: ttsSpeed }),
        signal: typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(12000) : undefined,
      });
      if (!res.ok) throw new Error(`TTS ${res.status}`);
      const blob = await res.blob();
      return URL.createObjectURL(blob);
    }

    async function fetchCloudAudioUrl(sentence, gen) {
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      const res = await fetch(`${TTS_API}/speak`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: sentence, voice: ttsVoice, model: ttsModel, speed: ttsSpeed }),
        signal: mergeAbortSignals(),
      });
      if (!res.ok) throw new Error(`TTS ${res.status}`);
      const blob = await res.blob();
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      return URL.createObjectURL(blob);
    }

    function setSlideCaption(text) {
      const el = $("slideCaption");
      const live = $("liveCaption");
      if (live) {
        live.textContent = text || "等待讲解…";
        live.classList.toggle("empty", !text);
        live.scrollTop = live.scrollHeight;
      }
      if (!el) return;
      if (!text) { el.hidden = true; el.textContent = ""; return; }
      el.hidden = false;
      el.textContent = text;
    }

    function scrollChatLog() {
      document.querySelectorAll(".qa-log").forEach((log) => {
        log.scrollTop = log.scrollHeight;
      });
    }

    function setTranscriptHtml(html) {
      const el = $("transcript");
      el.innerHTML = html;
      scrollChatLog();
    }

    function prefetchSlideImages(from = 0) {
      for (let i = from; i < slides.length; i++) {
        const img = new Image();
        img.decoding = "async";
        img.src = slideImageUrl(slides[i], i);
      }
    }

    function prefetchAllSlidesAudio() {
      if (!useCloudTts || !TTS_API) return;
      for (let i = 0; i < slides.length; i++) prefetchSlideAudio(i);
    }

    function prefetchSlideAudio(slideIndex) {
      if (slideIndex < 0 || slideIndex >= slides.length || !useCloudTts || !TTS_API) return;
      const script = slides[slideIndex]?.script;
      if (!script) return;
      const key = `slide:${slideIndex}`;
      if (ttsPrefetch.cache.has(key)) return;
      ttsPrefetch.cache.set(
        key,
        fetchCloudAudioPrefetch(script).catch((e) => {
          ttsPrefetch.cache.delete(key);
          throw e;
        })
      );
    }

    function prefetchCloudChunk(sentence, key, gen) {
      if (!useCloudTts || !TTS_API || ttsPrefetch.cache.has(key)) return;
      ttsPrefetch.cache.set(
        key,
        fetchCloudAudioUrl(sentence, gen).catch((e) => {
          ttsPrefetch.cache.delete(key);
          throw e;
        })
      );
    }

    async function playBlobUrl(url, gen) {
      if (gen !== speakGen) { URL.revokeObjectURL(url); throw new DOMException("Aborted", "AbortError"); }
      stopPlayer();
      player.src = url;
      player.currentTime = 0;
      player.muted = false;
      ttsStartedAt = Date.now();
      const cleanup = () => { player.onended = null; player.onerror = null; };
      try {
        await player.play();
      } catch (e) {
        if (gen !== speakGen) { cleanup(); URL.revokeObjectURL(url); throw new DOMException("Aborted", "AbortError"); }
        if (audioCtx) {
          try {
            const res = await fetch(url);
            const buf = await res.arrayBuffer();
            const audioBuf = await audioCtx.decodeAudioData(buf.slice(0));
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(audioCtx.destination);
            await new Promise((resolve, reject) => {
              if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
              src.onended = resolve;
              src.start(0);
            });
            cleanup();
            return;
          } catch (webErr) {
            console.warn("WebAudio fallback", webErr);
          }
        }
        cleanup();
        throw new Error(e.name === "NotAllowedError"
          ? "浏览器阻止播放：请再点一次「讲解本页」，并确认页面标签未被静音"
          : `播放失败 (${e.name || e.message})`);
      }
      try {
        await new Promise((resolve, reject) => {
          if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
          player.onended = () => { cleanup(); resolve(); };
          player.onerror = () => {
            cleanup();
            if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
            reject(new Error("audio element error"));
          };
        });
      } catch (e) {
        cleanup();
        throw e;
      }
    }

    async function speakOneCloud(sentence, gen, cacheKey, progressHint) {
      if (gen !== speakGen) throw new DOMException("Aborted", "AbortError");
      pauseMicForTts();
      synth.cancel();
      lastSpokenChunk = sentence;
      setSlideCaption(sentence);
      const cached = cacheKey != null ? ttsPrefetch.cache.get(cacheKey) : null;
      const hasCached = Boolean(cached);
      if (progressHint && !hasCached) setState(State.SPEAKING, progressHint + " · 合成中…", "讲解中");
      else if (progressHint) setState(State.SPEAKING, progressHint + " · 播放中", "讲解中");
      let url;
      if (cached) {
        ttsPrefetch.cache.delete(cacheKey);
        url = await cached;
      } else {
        url = await fetchCloudAudioUrl(sentence, gen);
      }
      if (progressHint) setState(State.SPEAKING, progressHint + " · 播放中", "讲解中");
      await playBlobUrl(url, gen);
      URL.revokeObjectURL(url);
    }

    function speakOneBrowser(sentence, gen) {
      pauseMicForTts();
      setSlideCaption(sentence);
      return new Promise((resolve, reject) => {
        if (gen !== speakGen) return reject(new DOMException("Aborted", "AbortError"));
        synth.cancel();
        lastSpokenChunk = sentence;
        const u = new SpeechSynthesisUtterance(sentence);
        u.lang = "zh-CN";
        u.rate = 1.1;
        const voice = getZhVoice();
        if (voice) u.voice = voice;

        clearInterval(pointerTimer);
        let startTime = Date.now();
        const charCount = sentence.length;
        const estimatedDurationMs = (charCount / (4.5 * u.rate)) * 1000;

        if (narration.active && showPointer) {
          pointerTimer = setInterval(() => {
            if (gen !== speakGen || state !== State.SPEAKING || !showPointer) {
              clearInterval(pointerTimer);
              return;
            }
            const elapsed = Date.now() - startTime;
            const currentPartProgress = Math.min(0.99, elapsed / estimatedDurationMs);
            const numParts = narration.parts.length || 1;
            const partIdx = narration.index;
            const overallProgress = (partIdx + currentPartProgress) / numParts;
            setDocPointerProgress(overallProgress);
          }, 100);
        }

        u.onstart = () => {
          ttsStartedAt = Date.now();
          startTime = Date.now();
        };
        u.onend = () => {
          clearInterval(pointerTimer);
          resolve();
        };
        u.onerror = (e) => {
          clearInterval(pointerTimer);
          if (e.error === "interrupted") {
            reject(new DOMException("Aborted", "AbortError"));
          } else {
            reject(e);
          }
        };
        synth.speak(u);
      });
    }

    async function speakOne(sentence, gen, cacheKey, progressHint) {
      if (useCloudTts && TTS_API) {
        try {
          await speakOneCloud(sentence, gen, cacheKey, progressHint);
          showError("");
          consecutiveTtsFailures = 0; // 成功时重置连续失败计数
          return;
        } catch (e) {
          if (abortCtrl?.signal?.aborted || gen !== speakGen) throw e;
          console.warn("cloud TTS", e);
          consecutiveTtsFailures++;
          if (consecutiveTtsFailures >= 2) {
            useCloudTts = false;
            showError("云端语音服务超时，已自动切换为浏览器本地语音播报。");
          } else {
            showError(`云端语音连接失败 (${e.message || e})，正在尝试本地播放...`);
          }
        }
      }
      setState(State.SPEAKING, "浏览器语音播放中…", "讲解中");
      await speakOneBrowser(sentence, gen);
      showError("");
    }

    function speakingHint(trackNarration) {
      if (trackNarration && listenEnabled) return "播报中 · 段末/页末可提问 · 或点常见问题";
      if (trackNarration) return "播放中 · 点「提问」或常见问题";
      return "播报中";
    }

    async function waitForQaWindow(ms) {
      pauseMicForTts();
      await delay(30);
      try { recognition?.start(); } catch (_) {}
      $("askInput")?.focus({ preventScroll: true });
      const deadline = Date.now() + ms;
      while (Date.now() < deadline || handlingQuestion) {
        if (handlingQuestion) await delay(100);
        else await delay(50);
      }
    }

    function ensureListen(on, hint) {
      if (on && !listenEnabled) {
        listenEnabled = true;
        updateActionButtons();
      }
      syncMicWithState();
      if (hint && listenEnabled && state !== State.SPEAKING) setState(state, hint);
    }

    async function speakParts(parts, { trackNarration = false, startAt = 0, deckLabel = "", slideIndex = null } = {}) {
      const gen = ++speakGen;
      abortCtrl = new AbortController();
      if (startAt === 0) clearTtsPrefetch(gen);
      if (trackNarration) {
        narration = { active: true, parts, index: startAt };
      }
      const speakLabel = deckLabel || (trackNarration ? "讲解中" : "播报中");
      setState(State.SPEAKING, speakingHint(trackNarration), speakLabel);
      pauseMicForTts();
      let finishedAll = false;
      try {
        let spoke = 0;
        for (let i = startAt; i < parts.length; i++) {
          if (abortCtrl.signal.aborted || gen !== speakGen) break;
          if (trackNarration) narration.index = i;
          if (trackNarration) {
            const denom = Math.max(1, parts.length - 1);
            setDocPointerProgress(i / denom);
          }
          const progress = parts.length > 1 ? `第 ${i + 1}/${parts.length} 段` : "";
          const cacheKey = slideIndex != null && parts.length === 1 ? `slide:${slideIndex}` : `${gen}:${i}`;
          if (slideIndex != null && presentation.active) {
            prefetchSlideAudio(slideIndex + 1);
          } else if (useCloudTts && TTS_API && i + 1 < parts.length) {
            prefetchCloudChunk(parts[i + 1], `${gen}:${i + 1}`, gen);
          }
          pauseMicForTts();
          await speakOne(parts[i], gen, cacheKey, progress);
          spoke++;
          if (trackNarration) narration.index = i + 1;
          if (trackNarration && listenEnabled && qaAutoListen && i + 1 < parts.length && gen === speakGen && !presentation.active) {
            setState(State.LISTENING, `可提问 · ${(QA_SENTENCE_GAP_MS / 1000).toFixed(1)} 秒后继续`, speakLabel);
            await waitForQaWindow(QA_SENTENCE_GAP_MS);
            if (gen !== speakGen || handlingQuestion) break;
            setState(State.SPEAKING, speakingHint(trackNarration), speakLabel);
          }
        }
        if (trackNarration && listenEnabled && qaAutoListen && gen === speakGen && spoke > 0 && !handlingQuestion && !presentation.active) {
          setState(State.LISTENING, `本段讲完 · 请提问 · ${(QA_SENTENCE_GAP_MS / 1000).toFixed(1)} 秒`, speakLabel);
          await waitForQaWindow(QA_SENTENCE_GAP_MS);
        }
        finishedAll = gen === speakGen && spoke === parts.length - startAt && parts.length > 0;
        if (gen === speakGen && trackNarration && finishedAll) {
          narration.active = false;
          setDocPointerProgress(1);
        }
      } catch (e) {
        if (e.name === "AbortError") {
          showError("");
        } else {
          console.warn(e);
          if (gen === speakGen) {
            showError(e.message || "播放失败，请重试");
            setState(listenEnabled ? State.LISTENING : State.IDLE, e.message || "播放失败，请重试");
          }
        }
      } finally {
        if (gen === speakGen) {
          clearTtsPrefetch(gen);
          synth.cancel();
          stopPlayer();
          if (presentation.active && trackNarration && finishedAll) {
            setState(State.LISTENING, "本页讲完 · 可提问 · 即将翻页", "演讲");
          } else if (!presentation.active) {
            if (!handlingQuestion) setSlideCaption("");
            const skipPostIdle = ["结束", "开场", "试听", "答疑"].includes(speakLabel);
            if (!skipPostIdle && (listenEnabled || qaAutoListen)) startQaIdleClose();
            else setState(State.IDLE, "讲解结束 · 可翻页或继续讲解");
          }
        }
      }
      return finishedAll && gen === speakGen;
    }

    async function speakStream(text, opts = {}) {
      let parts;
      const oneShot = opts.singleChunk || (opts.trackNarration && presentation.active && text.length <= TTS_MAX_CHARS);
      if (oneShot) {
        parts = [text];
      } else if (opts.trackNarration) {
        parts = groupForNarration(text);
        if (!parts.length) parts = [text];
      } else {
        parts = chunkForTts(text);
      }
      return speakParts(parts, opts);
    }

    function updatePresentButton() {
      updateActionButtons();
    }

    function speakCurrentSlide({ restart = false } = {}) {
      const s = slides[currentSlide]?.script;
      if (!s) {
        showError("本页没有讲解脚本，请检查 slides.json");
        return;
      }
      consecutiveTtsFailures = 0; // 重置失败计数
      if (TTS_API) useCloudTts = true; // 重新尝试云端
      if (restart) {
        speakGen++;
        clearTtsPrefetch(speakGen);
        abortCtrl?.abort();
        synth.cancel();
        stopPlayer();
        narration = { active: false, parts: [], index: 0 };
      }
      presentation.active = false;
      updateActionButtons();
      primePlayerOnClick();
      showError("");
      if (qaAutoListen) ensureListen(true);
      speakStream(s, { trackNarration: true, startAt: 0, slideIndex: currentSlide });
    }

    function getDeckIntro() {
      if (deck.intro === "") return null;
      if (deck.intro) return deck.intro;
      const t = deck.title || "本次研究";
      return `各位好，欢迎参加今天的汇报。接下来我将为大家介绍${t}。讲解过程中如有疑问，欢迎随时提问，我会尽力当场解答。现在我们开始。`;
    }

    function getDeckOutro() {
      if (deck.outro === "") return null;
      if (deck.outro) return deck.outro;
      return `以上是我的汇报内容，感谢各位的聆听。现在进入提问环节，欢迎大家就任何相关内容提出问题，我很乐意与您进一步讨论。`;
    }

    async function speakAside(text, hint, label = "演讲") {
      if (!text) return true;
      setState(State.SPEAKING, hint, label);
      return speakStream(text, { deckLabel: label });
    }

    async function speakOutroIfNeeded() {
      const outro = getDeckOutro();
      presentation.active = false;
      updatePresentButton();
      if (!outro) {
        finishPresentationWithQa();
        return;
      }
      await delay(200);
      const ok = await speakAside(outro, "结束语 · 欢迎提问", "结束");
      finishPresentationWithQa();
      if (!ok) console.warn("outro playback incomplete");
    }

    function endPresentation(msg) {
      presentation.active = false;
      updatePresentButton();
      if (!postExplainQaOpen && msg) {
        $("statusHint").textContent = msg;
      }
    }

    function takePresAdvance() {
      if (!presAdvanceTaken) return false;
      presAdvanceTaken = false;
      return true;
    }

    async function presentSlide(slideIndex) {
      if (!presentation.active || slideIndex >= slides.length) {
        if (slideIndex >= slides.length) finishPresentationWithQa();
        else endPresentation("演讲已停止");
        return;
      }
      currentSlide = slideIndex;
      renderSlide();
      const script = slides[slideIndex]?.script;
      if (!script) return presentSlide(slideIndex + 1);

      setState(State.SPEAKING, `第 ${slideIndex + 1}/${slides.length} 页 · 自动翻页`, "演讲");
      setSlideCaption(script.length > 160 ? script.slice(0, 160) + "…" : script);
      prefetchSlideAudio(slideIndex);
      prefetchSlideAudio(slideIndex + 1);
      await speakStream(script, {
        trackNarration: true, startAt: 0, deckLabel: "演讲", slideIndex,
      });
      if (!presentation.active) return;
      if (takePresAdvance()) return;
      if (handlingQuestion) return;
      if (narration.active && narration.index < narration.parts.length) return;

      if (slideIndex >= slides.length - 1) {
        await speakOutroIfNeeded();
        return;
      }
      if (presentation.active && qaAutoListen && listenEnabled) {
        setState(
          State.LISTENING,
          `第 ${slideIndex + 1} 页讲完 · 可提问 · ${(SLIDE_QA_PAUSE_MS / 1000).toFixed(1)} 秒后翻页`,
          "演讲"
        );
        await waitForQaWindow(SLIDE_QA_PAUSE_MS);
        if (!presentation.active) return;
        if (takePresAdvance()) return;
        if (handlingQuestion) return;
      }
      await delay(SLIDE_PAUSE_MS);
      if (!presentation.active || takePresAdvance() || handlingQuestion) return;
      return presentSlide(slideIndex + 1);
    }

    async function startPresentation(from = currentSlide) {
      cancelQaIdleClose();
      postExplainQaOpen = false;
      presAdvanceTaken = false;
      presentation.active = true;
      consecutiveTtsFailures = 0; // 重置失败计数
      if (TTS_API) useCloudTts = true; // 重新尝试云端
      updatePresentButton();
      primePlayerOnClick();
      showError("");
      if (qaAutoListen) ensureListen(true);
      prefetchAllSlidesAudio();
      prefetchSlideImages(from);
      prefetchSlideAudio(from);
      if (from === 0) {
        const intro = getDeckIntro();
        if (intro) {
          currentSlide = 0;
          renderSlide();
          prefetchSlideAudio(0);
          const ok = await speakAside(intro, "开场白", "开场");
          if (!presentation.active || !ok) return;
          await delay(SLIDE_PAUSE_MS);
        }
      }
      await presentSlide(from);
    }

    async function continuePresentationIfNeeded() {
      if (!presentation.active) return;
      if (narration.active && narration.index < narration.parts.length) return;
      const next = currentSlide + 1;
      if (next >= slides.length) {
        await speakOutroIfNeeded();
        return;
      }
      presAdvanceTaken = true;
      await delay(SLIDE_PAUSE_MS);
      await presentSlide(next);
    }

    async function resumeAfterAnswer(wasNarrating, wasPresenting, { resumeDelayMs = 0, forceResume = false } = {}) {
      const shouldResume = forceResume || $("autoResume").checked;
      if (!shouldResume) {
        if (wasNarrating || wasPresenting) {
          setState(listenEnabled ? State.LISTENING : State.IDLE, "说「继续」可接着讲");
        }
        return;
      }
      if (resumeDelayMs > 0) {
        setState(State.IDLE, `${Math.round(resumeDelayMs / 1000)} 秒后继续讲解…`);
        await delay(resumeDelayMs);
      }
      const label = wasPresenting ? "演讲" : "讲解";
      if (wasNarrating) {
        if (!forceResume) await speakParts(["好，继续。"], { deckLabel: label });
        await resumeNarration();
      }
      if (wasPresenting && presentation.active) {
        if (!wasNarrating) {
          // 如果提问前讲解已经放完了，答疑结束后等待 3 秒再翻页，给用户充足的时间看答案
          setState(State.IDLE, "3 秒后进入下一页…", "答疑");
          await delay(3000);
        }
        await continuePresentationIfNeeded();
      }
    }

    function hardStop(clearNarration = true) {
      cancelQaIdleClose();
      postExplainQaOpen = false;
      presAdvanceTaken = false;
      presentation.active = false;
      updatePresentButton();
      speakGen++;
      clearTtsPrefetch(speakGen);
      abortCtrl?.abort();
      synth.cancel();
      stopPlayer();
      setSlideCaption("");
      stopDocPointing();
      if (clearNarration) narration.active = false;
      setState(listenEnabled ? State.LISTENING : State.IDLE);
    }

    function interruptForQuestion() {
      speakGen++;
      clearTtsPrefetch(speakGen);
      abortCtrl?.abort();
      synth.cancel();
      stopPlayer();
    }

    async function resumeNarration() {
      const deckLabel = presentation.active ? "演讲" : "讲解中";
      const slideIndex = currentSlide;
      if (!narration.active || narration.index >= narration.parts.length) {
        const script = slides[currentSlide]?.script;
        if (!script) return false;
        return speakStream(script, { trackNarration: true, startAt: 0, slideIndex, deckLabel });
      }
      return speakParts(narration.parts, {
        trackNarration: true, startAt: narration.index, slideIndex, deckLabel,
      });
    }

    function slideImageUrl(slide, index) {
      const rel = slide?.image || `slides/slide_${String(index + 1).padStart(2, "0")}.png`;
      return BASE + rel;
    }

    function renderSlide() {
      const slide = slides[currentSlide];
      $("slideIndex").textContent = currentSlide + 1;
      $("slideTotal").textContent = slides.length;
      const scriptEl = $("scriptText");
      if (scriptEl) scriptEl.textContent = slide?.script || "—";
      $("slideTitle").textContent = slide?.title || `Slide ${currentSlide + 1}`;
      $("slideImage").src = slideImageUrl(slide, currentSlide);
      $("slideImage").alt = slide?.title || `Slide ${currentSlide + 1}`;
      const faqEl = $("faqList");
      if (faqEl) {
        faqEl.innerHTML = "";
        (slide?.faq || []).forEach((item) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "faq-chip";
          chip.textContent = item.q;
          chip.addEventListener("click", () => handleUserText(item.q, { fromClick: true }));
          faqEl.appendChild(chip);
        });
      }
      narration = { active: false, parts: [], index: 0 };
      updateActionButtons();
    }

    function scoreFaq(userText, item) {
      const u = normalize(userText);
      const q = normalize(item.q);
      if (!u || u.length < 2) return 0;
      if (u.includes(q) || q.includes(u)) return 100;
      let score = 0;
      const ut = tokens(userText);
      const qt = tokens(item.q);
      const at = tokens(item.a);
      for (const t of ut) {
        if (qt.has(t)) score += 3;
        if (at.has(t)) score += 2;
      }
      for (const kw of extractKeywords(item.q)) {
        if (u.includes(normalize(kw))) score += 5;
      }
      return score;
    }

    function extractKeywords(q) {
      const kws = [];
      const m = q.match(/[A-Za-z0-9]{2,}/g);
      if (m) kws.push(...m);
      q.replace(/[A-Za-z0-9\s？?，,。.！!]/g, " ").split(/\s+/).filter((w) => w.length >= 2).forEach((w) => kws.push(w));
      return kws;
    }

    function matchFaq(text) {
      const slide = slides[currentSlide];
      const items = slide?.faq || [];
      let best = null, bestScore = 0;
      for (const item of items) {
        const s = scoreFaq(text, item);
        if (s > bestScore) { bestScore = s; best = item; }
      }
      if (best && bestScore >= 4) return best.a;

      for (const item of items) {
        for (const kw of extractKeywords(item.q + item.a)) {
          if (text.toLowerCase().includes(kw.toLowerCase()) || normalize(text).includes(normalize(kw))) {
            return item.a;
          }
        }
      }
      return null;
    }

    function answerFromScript(text) {
      const slide = slides[currentSlide];
      const script = slide?.script || "";
      if (!script) return null;
      const parts = groupForNarration(script);
      const ut = tokens(text);
      let best = null, bestScore = 0;
      for (const p of parts) {
        let s = 0;
        for (const t of ut) if (tokens(p).has(t)) s++;
        if (s > bestScore) { bestScore = s; best = p; }
      }
      if (best && bestScore >= 2) return best;
      if (parts.length) return parts[0];
      return null;
    }

    function buildLiveAnswer(text) {
      const faq = matchFaq(text);
      if (faq) return faq;
      const fromScript = answerFromScript(text);
      if (fromScript) return fromScript;
      const script = slides[currentSlide]?.script || "";
      const groups = groupForNarration(script);
      const excerpt = groups.slice(0, 2).join("") || script.slice(0, 280);
      return `关于「${text.slice(0, 24)}」：${excerpt}`;
    }

    async function askLLM(userText, faqHint = "") {
      const slide = slides[currentSlide];
      const system = [
        "你是一位资深的抗体工程与免疫学专家，正在进行一场高水平的学术汇报并解答听众提问。",
        "请用专业、严谨且口语化的中文回答听众的问题，字数控制在 3-5 句话内，通俗易懂且富有洞察力并直接回答。",
        "【关键智能容错规则】：听众提问是通过语音识别（ASR）输入的，可能存在同音字或拼写错误（例如将「FLT3」识别为「福利的水」或「福利特三」，将「pDC」识别为「皮迪西」等）。请结合当前幻灯片上下文，智能推测听众的真实意图，并在回答开头委婉纠正（例如：『您问的应该是 FLT3（Fms样酪氨酸激酶3）...』）。",
        "【专业知识扩展】：虽然你应该以当前幻灯片内容、脚本和FAQ为核心上下文，但如果听众提问了幻灯片中涉及的专业学术名词（如靶点、细胞亚群、技术术语等），你必须结合你深厚的生物医药专业背景，给出准确、前沿的学术定义和机制解释，不要局限于脚本中已有的字面内容，但也不要捏造与本页数据冲突的数字。",
        `当前幻灯片（第 ${currentSlide + 1} 页）：${slide?.title || ""}`,
        `当前页讲解脚本：${slide?.script || ""}`,
        `当前页预设FAQ：${(slide?.faq || []).map((f) => f.q + "→" + f.a).join("；")}`,
        faqHint ? `参考提示（请结合专业知识进行扩写，不要生硬复述）：${faqHint}` : "",
      ].filter(Boolean).join("\n");
      const model = $("apiModel").value.trim() || "gpt-4o-mini";
      const maxTokens = 420;

      if (TTS_API) {
        const res = await fetch(`${TTS_API}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ system, user: userText, model, max_tokens: maxTokens }),
          signal: abortCtrl?.signal,
        });
        if (!res.ok) throw new Error(`LLM ${res.status}`);
        const j = await res.json();
        return j.text?.trim() || null;
      }

      const base = $("apiBase").value.trim().replace(/\/$/, "");
      const key = $("apiKey").value.trim();
      if (!base || !key) return null;
      const res = await fetch(`${base}/chat/completions`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
        body: JSON.stringify({
          model, stream: false, max_tokens: maxTokens,
          messages: [{ role: "system", content: system }, { role: "user", content: userText }],
        }),
        signal: abortCtrl?.signal,
      });
      if (!res.ok) throw new Error(`LLM ${res.status}`);
      const j = await res.json();
      return j.choices?.[0]?.message?.content?.trim() || null;
    }

    function isEcho(text) {
      if (!text || text.length < 2) return true;
      if (postExplainQaOpen || state === State.LISTENING) return false;
      if (state === State.SPEAKING && Date.now() - ttsStartedAt < 1200) return true;
      const n = normalize(text);
      const chunk = normalize(lastSpokenChunk);
      if (!chunk || chunk.length < 8) return false;
      // Whole-slide TTS: do not block real questions that share keywords with script
      if (chunk.length > 80) {
        return n.length >= 12 && chunk.includes(n) && n.length / chunk.length > 0.55;
      }
      if (chunk === n) return true;
      if (n.length >= 10 && chunk.includes(n)) return true;
      return false;
    }

    function shouldInterrupt(text) {
      if (!text || text.length < 2 || !listenEnabled || state !== State.SPEAKING) return false;
      if (isEcho(text)) return false;
      if (RESUME_RE.test(text) || STOP_RE.test(text) || NEXT_RE.test(text) || PREV_RE.test(text)) return true;
      return text.trim().length >= 2;
    }

    function submitAskInput() {
      const input = $("askInput");
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      if (!listenEnabled && !postExplainQaOpen) {
        listenEnabled = true;
        updateActionButtons();
      }
      handleUserText(text, { fromClick: true });
    }

    async function handleUserText(text, { fromClick = false, fromPtt = false } = {}) {
      if (!text?.trim() || handlingQuestion) return;
      if (!fromClick && isEcho(text)) return;

      text = text.trim();
      cancelQaIdleClose();

      if (RESUME_RE.test(text)) {
        interruptForQuestion();
        await resumeNarration();
        await continuePresentationIfNeeded();
        return;
      }
      if (NEXT_RE.test(text)) { hardStop(true); $("btnNext").click(); return; }
      if (PREV_RE.test(text)) { hardStop(true); $("btnPrev").click(); return; }
      if (STOP_RE.test(text)) { hardStop(true); return; }

      const wasPresenting = presentation.active;
      const wasNarrating = narration.active && narration.index < narration.parts.length;
      const inPostQa = postExplainQaOpen;
      listenEnabled = true;
      updateActionButtons();
      interruptForQuestion();

      handlingQuestion = true;
      $("reply").textContent = "正在思考…";
      $("reply").classList.remove("empty");
      setTranscriptHtml(`<span class="q-label">问：</span><span class="final">${escapeHtml(text)}</span>`);
      setState(State.THINKING, "理解您的问题…");
      abortCtrl = new AbortController();

      let answer = null;
      const faqHint = matchFaq(text);
      try {
        answer = await askLLM(text, faqHint || "");
      } catch (e) {
        if (e.name === "AbortError") { handlingQuestion = false; return; }
        console.warn("LLM", e);
        showError(`问答 API 异常：${e.message || e} · 已改用本地要点`);
      }
      if (!answer) answer = faqHint || buildLiveAnswer(text);
      if (!answer) {
        answer = "抱歉，我暂时无法回答这个问题，请换个方式提问或点击上方常见问题。";
      }

      $("reply").textContent = answer;
      $("reply").classList.remove("empty");
      qaHistory.push({
        t: new Date().toISOString(),
        slide: currentSlide + 1,
        q: text,
        a: answer,
      });
      scrollChatLog();
      setSlideCaption(answer);
      showError("");
      primePlayerOnClick();
      await speakParts([answer], { deckLabel: inPostQa || wasPresenting ? "答疑" : "讲解" });

      await resumeAfterAnswer(wasNarrating, wasPresenting, {
        resumeDelayMs: fromPtt ? 2000 : 0,
        forceResume: fromPtt,
      });
      handlingQuestion = false;
      if (inPostQa || postExplainQaOpen) {
        bumpQaIdleClose();
      } else if (!wasPresenting && !wasNarrating) {
        startQaIdleClose();
      }
    }

    function pttCombinedText() {
      return (pttFinalParts.join("") + pttInterim).trim();
    }

    function resetPttBuffer() {
      pttFinalParts = [];
      pttInterim = "";
    }

    function setPttUi(holding) {
      const btn = $("btnPtt");
      const label = $("pttLabel");
      const sideBtn = $("btnSidePtt");
      const sideLabel = $("sidePttLabel");
      if (btn) btn.classList.toggle("holding", holding);
      if (label) label.textContent = "按住提问";
      if (sideBtn) sideBtn.classList.toggle("holding", holding);
      if (sideLabel) sideLabel.textContent = "按住提问";
    }

    function startPtt() {
      if (!recognition || handlingQuestion || pttActive) return;
      primePlayerOnClick();
      cancelQaIdleClose();
      pttActive = true;
      resetPttBuffer();
      listenEnabled = true;
      postExplainQaOpen = true;
      if (state === State.SPEAKING) interruptForQuestion();
      setPttUi(true);
      setState(State.LISTENING, "按住说话…松手即发送");
      clearTimeout(micResumeTimer);
      try { recognition.abort(); } catch (_) {}
      try { recognition.stop(); } catch (_) {}
      micResumeTimer = setTimeout(() => {
        if (!pttActive) return;
        try { recognition.start(); } catch (e) {
          showError("无法启动麦克风，请允许浏览器使用麦克风");
          endPtt(true);
        }
      }, 80);
      updateActionButtons();
    }

    async function endPtt(cancelled = false) {
      if (!pttActive) return;
      pttActive = false;
      setPttUi(false);
      clearTimeout(micResumeTimer);
      try { recognition?.stop(); } catch (_) {}
      listenEnabled = false;
      postExplainQaOpen = false;
      updateActionButtons();

      const text = pttCombinedText();
      resetPttBuffer();

      if (cancelled) {
        setState(State.IDLE, "已取消提问");
        return;
      }
      if (!text || text.length < 2) {
        setState(State.IDLE, "未听到问题，请再按住说话");
        setTranscriptHtml(`<span class="interim">${escapeHtml("（未识别到语音，请再试）")}</span>`);
        return;
      }

      setTranscriptHtml(`<span class="q-label">问：</span><span class="final">${escapeHtml(text)}</span>`);
      await handleUserText(text, { fromClick: true, fromPtt: true });
    }

    function initPttButton() {
      const btns = [ $("btnPtt"), $("btnSidePtt") ].filter(Boolean);
      if (btns.length === 0) return;
      if (!recognition) {
        btns.forEach(btn => {
          btn.disabled = true;
          btn.title = "请使用 Chrome/Edge 并允许麦克风";
        });
        return;
      }
      const onDown = (e) => {
        e.preventDefault();
        startPtt();
      };
      const onUp = (e) => {
        e.preventDefault();
        endPtt(false);
      };
      btns.forEach(btn => {
        btn.addEventListener("mousedown", onDown);
        btn.addEventListener("mouseup", onUp);
        btn.addEventListener("mouseleave", () => { if (pttActive) endPtt(false); });
        btn.addEventListener("touchstart", onDown, { passive: false });
        btn.addEventListener("touchend", onUp, { passive: false });
        btn.addEventListener("touchcancel", () => endPtt(true));
      });
      window.addEventListener("mouseup", () => { if (pttActive) endPtt(false); });
      window.addEventListener("touchend", (e) => {
        if (pttActive && !btns.some(btn => btn.contains(e.target))) endPtt(false);
      }, { passive: false });
    }

    function initRecognition() {
      if (!SpeechRecognition) {
        const el = $("unsupported");
        if (el) {
          el.style.display = "block";
          el.textContent = "请使用 Chrome 或 Edge 以启用语音识别。";
        }
        const listenBtn = $("btnListen");
        if (listenBtn) listenBtn.disabled = true;
        $("btnPtt") && ($("btnPtt").disabled = true);
        $("btnSidePtt") && ($("btnSidePtt").disabled = true);
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "zh-CN";

      recognition.onresult = (ev) => {
        if (state === State.THINKING) return;
        if (pttActive) {
          let interim = "", final = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const r = ev.results[i];
            if (r.isFinal) final += r[0].transcript;
            else interim += r[0].transcript;
          }
          if (final) pttFinalParts.push(final);
          pttInterim = interim;
          const live = pttCombinedText();
          if (live) {
            setTranscriptHtml(`<span class="q-label">问：</span><span class="interim">${escapeHtml(live)}</span>`);
          }
          return;
        }
        if (state === State.SPEAKING) return;
        if (!listenEnabled && !postExplainQaOpen) return;
        let interim = "", final = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        const live = (final || interim).trim();
        if (!live) return;
        if (final && final.trim().length >= 2) {
          const ft = final.trim();
          setTranscriptHtml(`<span class="q-label">问：</span><span class="final">${escapeHtml(ft)}</span>`);
          handleUserText(ft);
        } else {
          setTranscriptHtml(`<span class="interim">${escapeHtml(live)}</span>`);
        }
      };
      recognition.onerror = (e) => {
        if (e.error === "not-allowed") {
          showError("麦克风未授权：请在浏览器地址栏允许麦克风");
          listenEnabled = false;
          if (pttActive) endPtt(true);
          updateActionButtons();
        } else if (e.error !== "no-speech" && e.error !== "aborted") {
          console.warn(e.error);
        }
      };
      recognition.onend = () => {
        if (pttActive) {
          clearTimeout(micResumeTimer);
          micResumeTimer = setTimeout(() => {
            if (pttActive) {
              try { recognition.start(); } catch (_) {}
            }
          }, 120);
          return;
        }
        const ok = (listenEnabled || postExplainQaOpen) && state !== State.THINKING && state !== State.SPEAKING;
        if (ok) {
          try { recognition.start(); } catch (_) {}
        }
      };
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function toggleListen() {
      const turningOn = !listenEnabled;
      if (turningOn) {
        primePlayerOnClick();
        // Stop any narration/playback so the mic can actually hear the user.
        if (state === State.SPEAKING) interruptForQuestion();
        listenEnabled = true;
        postExplainQaOpen = true;
        setState(State.LISTENING, "请说出您的问题…（或在右侧输入）");
        clearTimeout(micResumeTimer);
        try { recognition?.stop(); } catch (_) {}
        micResumeTimer = setTimeout(() => {
          try { recognition?.start(); } catch (_) {}
        }, 220);
        $("askInput")?.focus({ preventScroll: true });
      } else {
        listenEnabled = false;
        postExplainQaOpen = false;
        try { recognition?.stop(); } catch (_) {}
        setState(State.IDLE, "提问已关闭");
      }
      updateActionButtons();
    }

    function appendVoiceToSub() {
      // Safely do nothing or update hidden sub
      if (!$("deckSub")) return;
      const base = $("deckSub").textContent.replace(/ · 播音员：.*$/, "").replace(/ · 云端语音 OK · .*$/, "");
      $("deckSub").textContent = `${base} · 播音员：${ttsVoice}（${VOICE_LABELS[ttsVoice] || ttsVoice}）`;
    }

      const el = $("voiceCurrentLabel");
      if (el) el.innerHTML = `<em>播音员</em> ${ttsVoice} · ${VOICE_LABELS[ttsVoice] || ttsVoice}`;
      const vq = $("voiceQuick");

    function openVoiceModal() {
      $("voiceModal").hidden = false;
      renderVoiceCards();
      $("ttsModelSelect").value = ttsModel;
      $("ttsSpeedSelect").value = String(ttsSpeed);
    }

    function closeVoiceModal() {
      $("voiceModal").hidden = true;
    }

    function openTipModal() {
      $("tipModal").hidden = false;
    }

    function closeTipModal() {
      $("tipModal").hidden = true;
    }

    function safeName(s) {
      return String(s || "").replace(/[\\/:*?"<>|]+/g, "_").slice(0, 80) || "ppt";
    }

    function downloadTextFile(filename, content) {
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function downloadQaLog() {
      const title = deck?.title || PROJECT || "PPT";
      const ts = new Date().toISOString().replace(/[:.]/g, "-");
      const lines = [];
      lines.push(`# ${title} 问答记录`);
      lines.push(`导出时间: ${new Date().toLocaleString()}`);
      lines.push("");
      if (!qaHistory.length) {
        lines.push("暂无问答记录。");
      } else {
        qaHistory.forEach((item, idx) => {
          lines.push(`## ${idx + 1}. Slide ${item.slide}`);
          lines.push(`问: ${item.q}`);
          lines.push(`答: ${item.a}`);
          lines.push("");
        });
      }
      downloadTextFile(`${safeName(title)}_qa_${ts}.txt`, lines.join("\n"));
    }

    function downloadScript() {
      const title = deck?.title || PROJECT || "PPT";
      const ts = new Date().toISOString().replace(/[:.]/g, "-");
      const lines = [];
      lines.push(`# ${title} 解说词`);
      lines.push(`导出时间: ${new Date().toLocaleString()}`);
      lines.push("");
      (slides || []).forEach((s, i) => {
        lines.push(`## Slide ${i + 1} - ${s?.title || ""}`);
        lines.push(s?.script || "（无解说词）");
        lines.push("");
      });
      downloadTextFile(`${safeName(title)}_script_${ts}.txt`, lines.join("\n"));
    }

    function selectVoice(id) {
      if (!TTS_VOICES.includes(id)) return;
      ttsVoice = id;
      localStorage.setItem("ppt-voice-voice", ttsVoice);
      renderVoiceCards();
      updateVoiceLabel();
      consecutiveTtsFailures = 0; // 重置失败计数
      if (TTS_API) useCloudTts = true; // 重新尝试云端
    }

    function renderVoiceCards() {
      const grid = $("voiceGrid");

        card.setAttribute("role", "radio");

        card.addEventListener("click", () => selectVoice(id));

    function initResizableSidebar() {
      const handle = $("resizeHandle");
      const sidebar = document.querySelector(".qa-panel");
      const mainArea = document.querySelector(".main-area");
      if (!handle || !sidebar || !mainArea) return;

      let isDragging = false;
      let startX = 0;
      let startWidth = 0;

      // Load saved width
      const savedWidth = localStorage.getItem("ppt-voice-sidebar-width");
      if (savedWidth) {
        sidebar.style.width = savedWidth + "px";
      }

      handle.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
        startWidth = sidebar.getBoundingClientRect().width;
        handle.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = startX - e.clientX;
        let newWidth = startWidth + dx;
        
        if (newWidth < 280) newWidth = 280;
        if (newWidth > mainArea.getBoundingClientRect().width * 0.6) {
          newWidth = mainArea.getBoundingClientRect().width * 0.6;
        }

        sidebar.style.width = newWidth + "px";
        localStorage.setItem("ppt-voice-sidebar-width", String(newWidth));
      });

      document.addEventListener("mouseup", () => {
        if (isDragging) {
          isDragging = false;
          handle.classList.remove("dragging");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        }
      });
    }

    async function loadDeck() {
      const res = await fetch(`${BASE}slides.json`, { cache: "no-store" });
      if (!res.ok) throw new Error(`无法加载 ${BASE}slides.json`);
      deck = await res.json();
      slides = deck.slides || [];
      $("deckTitle").textContent = deck.title || PROJECT;
      $("deckSub").textContent = `${slides.length} 页 · 全场演讲自动翻页 · 段末/页末可提问`;
      document.title = (deck.title || "PPT") + " · 语音播放器";
      currentSlide = 0;
      renderSlide();
      prefetchSlideImages(0);
      if (TTS_API) prefetchAllSlidesAudio();
    }

    $("btnPrev").addEventListener("click", () => { hardStop(true); currentSlide = Math.max(0, currentSlide - 1); renderSlide(); });
    $("btnNext").addEventListener("click", () => { hardStop(true); currentSlide = Math.min(slides.length - 1, currentSlide + 1); renderSlide(); });
    const projectSelect = $("projectSelect");
    if (projectSelect) {
      projectSelect.value = PROJECT;
      projectSelect.addEventListener("change", (e) => {
        const val = e.target.value;
        if (val) {
          hardStop(true);
          window.location.search = "?project=" + val;
        }
      });
    }
    $("btnPresent").addEventListener("click", () => {
      if (presentation.active) { hardStop(true); return; }
      primePlayerOnClick();
      startPresentation(currentSlide);
    });
    $("btnSpeak").addEventListener("click", handleSpeakClick);
    $("btnListen")?.addEventListener("click", toggleListen);
    $("btnStop").addEventListener("click", () => hardStop(true));
    $("btnAskSend").addEventListener("click", submitAskInput);
    $("askInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAskInput(); }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (!$("voiceModal").hidden) { closeVoiceModal(); return; }
        hardStop(true);
        return;
      }
      if (e.key === "ArrowRight") $("btnNext").click();
      if (e.key === "ArrowLeft") $("btnPrev").click();
      if (e.key === " ") { e.preventDefault(); $("btnPresent").click(); }
    });

    initLlmConfig();
    speechSynthesis.onvoiceschanged = () => getZhVoice();
    initRecognition();
    initPttButton();
    initVoicePicker();
    initResizableSidebar();
    const THEMES = ["dark", "ivory", "beige", "gruvbox"];
    const THEME_LABELS = {
      "dark": "深邃星空",
      "ivory": "学术象牙",
      "beige": "极客沙色",
      "gruvbox": "怀旧复古"
    };
    const btnThemeToggle = $("btnThemeToggle");
    const themeLabel = $("themeLabel");
    const updateThemeUi = (theme) => {
      document.documentElement.setAttribute("data-theme", theme);
      if (themeLabel) themeLabel.textContent = THEME_LABELS[theme] || theme;
    };
    if (btnThemeToggle) {
      updateThemeUi(currentTheme);
      btnThemeToggle.addEventListener("click", () => {
        let idx = THEMES.indexOf(currentTheme);
        currentTheme = THEMES[(idx + 1) % THEMES.length];
        localStorage.setItem("ppt-voice-theme", currentTheme);
        updateThemeUi(currentTheme);
      });
    }
    updatePresenterAvatar(State.IDLE);
    $("qaAutoListen").checked = qaAutoListen;
    $("qaAutoListen").addEventListener("change", (e) => {
      qaAutoListen = e.target.checked;
      localStorage.setItem("ppt-voice-qa-auto", qaAutoListen ? "1" : "0");
      updateActionButtons();
    });
    $("showPresenterChk").checked = showPresenter;
    $("showPresenterChk").addEventListener("change", (e) => {
      showPresenter = e.target.checked;
      localStorage.setItem("ppt-voice-show-presenter", showPresenter ? "1" : "0");
      const pres = $("presenter");
      if (pres) pres.style.display = showPresenter ? "" : "none";
    });
    $("showPointerChk").checked = showPointer;
    $("showPointerChk").addEventListener("change", (e) => {
      showPointer = e.target.checked;
      localStorage.setItem("ppt-voice-show-pointer", showPointer ? "1" : "0");
      if (!showPointer) stopDocPointing();
      else if (state === State.SPEAKING) startDocPointing();
    });

    // 监听标签页可见性变化，解决切后台导致播放中断或暂停的问题
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (state === State.SPEAKING) {
          if (useCloudTts && TTS_API) {
            // 云端语音：如果音频被浏览器暂停了，切回来时自动恢复播放
            if (player && player.paused && !player.ended && player.src && player.src !== SILENT_WAV) {
              player.play().catch((e) => console.warn("Player background resume error", e));
            }
          } else {
            // 本地浏览器语音：如果被浏览器强制暂停或挂起，切回来时自动恢复或重播当前句
            try {
              if (synth.paused) {
                synth.resume();
              } else {
                const txt = lastSpokenChunk;
                if (txt) {
                  synth.cancel();
                  const u = new SpeechSynthesisUtterance(txt);
                  u.lang = "zh-CN";
                  u.rate = 1.1;
                  const voice = getZhVoice();
                  if (voice) u.voice = voice;
                  u.onstart = () => { ttsStartedAt = Date.now(); };
                  u.onend = () => {
                    continuePresentationIfNeeded();
                  };
                  synth.speak(u);
                }
              }
            } catch (e) {
              console.warn("SpeechSynthesis background resume error", e);
            }
          }
        }
      }
    });

    updateActionButtons();
    loadDeck().then(async () => {
      await syncLlmFromServer();
      if (!TTS_API) appendVoiceToSub();
    }).catch((e) => { $("deckSub").textContent = "加载失败：" + e.message; console.error(e); });
  </script>
</body>
</html>
